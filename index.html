<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Speaking Card Box</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@400;500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#1B2A41;
    --teal:#2A8F82;
    --gold:#D79A3B;
    --cream:#F7F3E9;
    --card-line:#DCD4BE;
    --card-margin:#C1544A;
    --ink-light:#5B6B7A;
    --paper:#FFFDF7;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--cream);
    font-family:'Inter',sans-serif;
    color:var(--navy);
    min-height:100vh;
    padding:28px 16px 60px;
  }
  .wrap{max-width:760px;margin:0 auto;}

  header.top{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    margin-bottom:22px;
    border-bottom:3px solid var(--navy);
    padding-bottom:12px;
  }
  header.top h1{
    font-family:'Zilla Slab',serif;
    font-weight:700;
    font-size:1.9rem;
    margin:0;
    letter-spacing:-0.01em;
  }
  header.top span{
    font-family:'IBM Plex Mono',monospace;
    font-size:0.72rem;
    color:var(--ink-light);
    text-transform:uppercase;
    letter-spacing:0.08em;
  }

  nav.tabs{
    display:flex;
    gap:6px;
    margin-bottom:18px;
    flex-wrap:wrap;
  }
  nav.tabs button{
    font-family:'IBM Plex Mono',monospace;
    font-size:0.75rem;
    letter-spacing:0.04em;
    text-transform:uppercase;
    background:var(--paper);
    border:1.5px solid var(--card-line);
    border-bottom:none;
    color:var(--ink-light);
    padding:9px 14px;
    border-radius:6px 6px 0 0;
    cursor:pointer;
    position:relative;
    top:1px;
  }
  nav.tabs button.active{
    background:var(--navy);
    color:var(--cream);
    border-color:var(--navy);
  }

  .panel{
    background:var(--paper);
    border:1.5px solid var(--card-line);
    border-radius:4px;
    padding:26px;
    position:relative;
  }

  .card-index{
    background:
      repeating-linear-gradient(var(--paper), var(--paper) 27px, var(--card-line) 28px, var(--paper) 29px);
    border:1.5px solid var(--card-line);
    border-left:4px solid var(--card-margin);
    border-radius:2px;
    padding:22px 24px 22px 30px;
    min-height:220px;
    position:relative;
    box-shadow:3px 3px 0 rgba(27,42,65,0.06), 6px 6px 0 rgba(27,42,65,0.03);
  }
  .card-index .eyebrow{
    font-family:'IBM Plex Mono',monospace;
    font-size:0.68rem;
    text-transform:uppercase;
    letter-spacing:0.1em;
    color:var(--teal);
    margin-bottom:6px;
  }
  .card-index h2{
    font-family:'Zilla Slab',serif;
    font-size:1.5rem;
    margin:0 0 16px;
    line-height:1.3;
  }
  .tagrow{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px;}
  .tag{
    font-family:'IBM Plex Mono',monospace;
    font-size:0.78rem;
    padding:5px 10px;
    border-radius:14px;
    border:1.3px solid currentColor;
    white-space:nowrap;
    cursor:pointer;
    background:none;
  }
  .tag:hover{background:rgba(27,42,65,0.06);}
  .tag.pv{color:var(--teal);}
  .tag.idiom{color:var(--gold);}
  .tag.vocab{color:var(--navy);}
  .group-label{
    font-family:'IBM Plex Mono',monospace;
    font-size:0.68rem;
    text-transform:uppercase;
    letter-spacing:0.08em;
    color:var(--ink-light);
    margin:14px 0 6px;
  }
  .empty-hint{color:var(--ink-light);font-size:0.9rem;font-style:italic;}

  .draw-btn{
    font-family:'IBM Plex Mono',monospace;
    text-transform:uppercase;
    letter-spacing:0.06em;
    font-size:0.85rem;
    background:var(--navy);
    color:var(--cream);
    border:none;
    padding:12px 22px;
    border-radius:5px;
    cursor:pointer;
    margin-top:18px;
  }
  .draw-btn:hover{background:#101c2e;}

  @keyframes pullCard{
    0%{transform:translateY(-14px) rotate(-1.2deg);opacity:0;}
    100%{transform:translateY(0) rotate(0deg);opacity:1;}
  }
  .card-index.fresh{animation:pullCard 0.28s ease-out;}

  .taboo-target{
    font-family:'Zilla Slab',serif;
    font-weight:700;
    font-size:2.1rem;
    color:var(--navy);
    margin:4px 0 18px;
  }
  .forbidden-list{list-style:none;padding:0;margin:0;}
  .forbidden-list li{
    font-family:'IBM Plex Mono',monospace;
    font-size:0.95rem;
    color:var(--card-margin);
    text-decoration:line-through;
    padding:4px 0;
  }

  .ladder-steps{margin-top:16px;padding-left:0;list-style:none;}
  .ladder-steps li{
    font-family:'Inter',sans-serif;
    font-size:0.92rem;
    color:var(--ink-light);
    padding:6px 0 6px 20px;
    border-left:2px solid var(--card-line);
    margin-left:6px;
  }
  .ladder-steps li strong{color:var(--navy);cursor:pointer;text-decoration:underline dotted;}

  p.hint{color:var(--ink-light);font-size:0.88rem;line-height:1.5;margin-top:4px;}

  .manage-grid{display:grid;grid-template-columns:1fr;gap:22px;}
  .manage-section h3{
    font-family:'Zilla Slab',serif;
    font-size:1.15rem;
    margin:0 0 4px;
    display:flex;
    align-items:center;
    gap:8px;
  }
  .manage-section h3 .count{
    font-family:'IBM Plex Mono',monospace;
    font-size:0.7rem;
    color:var(--ink-light);
    font-weight:400;
  }
  .chip-list{display:flex;flex-wrap:wrap;gap:7px;margin:10px 0 12px;}
  .chip{
    display:flex;align-items:center;gap:6px;
    background:var(--cream);
    border:1.2px solid var(--card-line);
    border-radius:14px;
    padding:5px 6px 5px 12px;
    font-size:0.85rem;
    cursor:pointer;
  }
  .chip:hover{border-color:var(--navy);}
  .chip button{
    background:none;border:none;color:var(--card-margin);
    cursor:pointer;font-size:0.95rem;line-height:1;padding:2px 4px;
  }
  .add-row{display:flex;gap:8px;}
  .add-row input{
    flex:1;
    font-family:'Inter',sans-serif;
    font-size:0.9rem;
    padding:8px 10px;
    border:1.3px solid var(--card-line);
    border-radius:5px;
    background:var(--paper);
  }
  .add-row button{
    font-family:'IBM Plex Mono',monospace;
    font-size:0.8rem;
    background:var(--teal);
    color:white;
    border:none;
    border-radius:5px;
    padding:0 16px;
    cursor:pointer;
  }
  .add-word-btn{
    font-family:'IBM Plex Mono',monospace;
    font-size:0.78rem;
    background:none;
    border:1.3px dashed var(--card-line);
    color:var(--ink-light);
    border-radius:6px;
    padding:8px 12px;
    cursor:pointer;
    margin-top:2px;
  }
  .add-word-btn:hover{border-color:var(--navy);color:var(--navy);}
  .taboo-manage-item{
    border:1.2px solid var(--card-line);
    border-radius:6px;
    padding:10px 12px;
    margin-bottom:8px;
    font-size:0.88rem;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
  }
  .taboo-manage-item .fb{color:var(--ink-light);font-size:0.8rem;}
  .taboo-manage-item button{
    background:none;border:none;color:var(--card-margin);cursor:pointer;font-size:1rem;
  }

  footer.status{
    text-align:center;
    font-family:'IBM Plex Mono',monospace;
    font-size:0.7rem;
    color:var(--ink-light);
    margin-top:16px;
  }

  /* modal */
  .modal-overlay{
    position:fixed;inset:0;
    background:rgba(27,42,65,0.45);
    display:flex;align-items:center;justify-content:center;
    padding:20px;
    z-index:50;
  }
  .modal-overlay.hidden{display:none;}
  .modal-card{
    max-width:480px;width:100%;
    max-height:85vh;
    overflow-y:auto;
  }
  .modal-close{
    position:absolute;top:10px;right:14px;
    background:none;border:none;font-size:1.3rem;
    color:var(--ink-light);cursor:pointer;
  }
  .meaning-block{margin-bottom:14px;padding-bottom:12px;border-bottom:1px dashed var(--card-line);}
  .meaning-block:last-of-type{border-bottom:none;}
  .meaning-num{
    font-family:'IBM Plex Mono',monospace;
    font-size:0.68rem;color:var(--teal);text-transform:uppercase;letter-spacing:0.06em;
  }
  .meaning-def{font-size:0.98rem;margin:4px 0 6px;}
  .meaning-ex{font-size:0.92rem;color:var(--ink-light);font-style:italic;}
  .modal-actions{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap;}
  .modal-actions button{
    font-family:'IBM Plex Mono',monospace;
    font-size:0.78rem;
    border-radius:5px;
    padding:9px 14px;
    cursor:pointer;
    border:1.3px solid var(--navy);
  }
  .btn-primary{background:var(--navy);color:var(--cream);}
  .btn-ghost{background:none;color:var(--navy);}
  .btn-danger{background:none;color:var(--card-margin);border-color:var(--card-margin);}
  .edit-field label{
    font-family:'IBM Plex Mono',monospace;
    font-size:0.68rem;text-transform:uppercase;letter-spacing:0.06em;
    color:var(--ink-light);display:block;margin-bottom:4px;
  }
  .edit-field input, .edit-field textarea{
    width:100%;font-family:'Inter',sans-serif;font-size:0.92rem;
    padding:7px 9px;border:1.3px solid var(--card-line);border-radius:5px;
    margin-bottom:10px;background:var(--paper);resize:vertical;
  }
  .remove-meaning-btn{
    font-family:'IBM Plex Mono',monospace;font-size:0.7rem;
    background:none;border:none;color:var(--card-margin);cursor:pointer;
  }
</style>
</head>
<body>
<div class="wrap">

  <header class="top">
    <h1>Speaking Card Box</h1>
    <span id="tabLabel">Story Cubes</span>
  </header>

  <nav class="tabs" id="tabs">
    <button data-tab="story" class="active">Story Cubes</button>
    <button data-tab="debate">Debate Cards</button>
    <button data-tab="taboo">Taboo+</button>
    <button data-tab="ladder">Laddering</button>
    <button data-tab="manage">Manage Lists</button>
  </nav>

  <div class="panel" id="panel"></div>

  <footer class="status" id="status">loading your lists…</footer>
</div>

<div class="modal-overlay hidden" id="modalOverlay">
  <div class="modal-card card-index" id="modalCard" style="position:relative;"></div>
</div>

<script>
const STORAGE_KEY = "speaking-toolkit-lists-v2";

function w(text, meanings){ return {text, meanings}; }

const DEFAULT_LISTS = {
  themes: [
    "You accidentally became famous.",
    "You are trying to convince your friend to quit their job.",
    "You discovered a hidden talent.",
    "You got lost in a foreign city.",
    "You witnessed something strange at work.",
    "You have to give a toast at a wedding.",
    "You're moving to a new country.",
    "You found out a secret about a friend.",
    "You have to cancel plans at the last minute.",
    "You're starting a new hobby.",
    "You had an embarrassing moment in public.",
    "You're negotiating a raise.",
    "You're meeting your partner's parents for the first time.",
    "You're stuck in a long delay at the airport."
  ],
  phrasalVerbs: [
    w("turn down",[{definition:"Reject an offer or request.",example:"She turned down the promotion because it meant relocating."},{definition:"Reduce the volume or level of something.",example:"Can you turn down the music? It's too loud."}]),
    w("run into",[{definition:"Meet someone unexpectedly.",example:"I ran into my old professor at the airport."},{definition:"Encounter a problem or difficulty.",example:"We ran into some issues with the budget."}]),
    w("pull off",[{definition:"Succeed at something difficult.",example:"Somehow they pulled off the deal at the last minute."},{definition:"Drive a vehicle to the side of the road.",example:"He pulled off the highway to check the map."}]),
    w("give up",[{definition:"Stop trying to do something.",example:"Don't give up on your goals."},{definition:"Surrender or hand something over.",example:"She gave up her seat for the elderly man."}]),
    w("put off",[{definition:"Postpone something.",example:"They put off the meeting until next week."}]),
    w("look forward to",[{definition:"Feel excited about something that is going to happen.",example:"I'm looking forward to the weekend."}]),
    w("come across",[{definition:"Find something by chance.",example:"I came across an old photo in the drawer."},{definition:"Give a certain impression.",example:"He came across as very confident in the interview."}]),
    w("get along with",[{definition:"Have a friendly relationship with someone.",example:"She gets along with everyone at work."}]),
    w("figure out",[{definition:"Understand or solve something.",example:"It took a while to figure out the instructions."}]),
    w("deal with",[{definition:"Handle a problem or situation.",example:"He's dealing with a lot of stress lately."}]),
    w("catch up on",[{definition:"Do something you fell behind on.",example:"I need to catch up on my sleep this weekend."}]),
    w("break down",[{definition:"Stop functioning, usually a machine or vehicle.",example:"The car broke down on the highway."},{definition:"Become very upset, often crying.",example:"She broke down in tears during the meeting."}]),
    w("bring up",[{definition:"Mention a topic in conversation.",example:"He brought up the issue during dinner."},{definition:"Raise a child.",example:"She was brought up by her grandparents."}]),
    w("call off",[{definition:"Cancel something.",example:"They called off the wedding."}]),
    w("carry on",[{definition:"Continue doing something.",example:"Please carry on with your work."}]),
    w("come up with",[{definition:"Think of an idea or plan.",example:"She came up with a brilliant solution."}]),
    w("cut back on",[{definition:"Reduce the amount of something.",example:"He's cutting back on sugar."}]),
    w("end up",[{definition:"Eventually reach a situation or place, often unplanned.",example:"We ended up staying home instead."}]),
    w("fall behind",[{definition:"Fail to keep up with a schedule or others.",example:"He fell behind on his rent payments."}]),
    w("get away with",[{definition:"Do something wrong without being punished.",example:"She got away with being late every day."}]),
    w("go over",[{definition:"Review something carefully.",example:"Let's go over the report before the meeting."}]),
    w("hold on",[{definition:"Wait a moment.",example:"Hold on, I'll be right there."},{definition:"Grip something tightly.",example:"Hold on to the railing."}]),
    w("keep up with",[{definition:"Stay at the same pace or level as someone or something.",example:"It's hard to keep up with the news these days."}]),
    w("look into",[{definition:"Investigate something.",example:"The police are looking into the incident."}]),
    w("make up for",[{definition:"Compensate for something.",example:"He bought flowers to make up for being late."}]),
    w("point out",[{definition:"Indicate or mention something.",example:"She pointed out a mistake in the report."}]),
    w("put up with",[{definition:"Tolerate something unpleasant.",example:"I don't know how she puts up with his complaints."}]),
    w("run out of",[{definition:"Have no more of something left.",example:"We ran out of milk."}]),
    w("set up",[{definition:"Arrange or prepare something.",example:"They set up the equipment before the show."},{definition:"Trick someone into a bad situation.",example:"He claimed he was set up by his coworker."}]),
    w("sort out",[{definition:"Resolve or organize something.",example:"We need to sort out this confusion."}]),
    w("stand out",[{definition:"Be noticeably better or different.",example:"Her resume really stands out."}]),
    w("take after",[{definition:"Resemble a family member in appearance or character.",example:"She takes after her mother."}]),
    w("wear off",[{definition:"Gradually disappear, usually an effect or feeling.",example:"The medicine's effect wore off after a few hours."}]),
    w("work out",[{definition:"Exercise.",example:"He works out every morning."},{definition:"End successfully.",example:"I hope things work out for them."}])
  ],
  idioms: [
    w("out of the blue",[{definition:"Unexpectedly, without warning.",example:"He called me out of the blue after years of silence."}]),
    w("on the same page",[{definition:"In agreement or having the same understanding.",example:"Let's make sure we're on the same page before the meeting."}]),
    w("hit the nail on the head",[{definition:"Describe something exactly right.",example:"You hit the nail on the head with that observation."}]),
    w("once in a blue moon",[{definition:"Very rarely.",example:"We only go out to eat once in a blue moon."}]),
    w("break the ice",[{definition:"Ease tension in a new or awkward social situation.",example:"He told a joke to break the ice."}]),
    w("cost an arm and a leg",[{definition:"Be very expensive.",example:"That car must have cost an arm and a leg."}]),
    w("under the weather",[{definition:"Feeling slightly ill.",example:"I'm staying home today; I'm under the weather."}]),
    w("bite the bullet",[{definition:"Do something difficult or unpleasant that can't be avoided.",example:"I finally bit the bullet and went to the dentist."}]),
    w("spill the beans",[{definition:"Reveal a secret.",example:"Someone spilled the beans about the surprise party."}]),
    w("the ball is in your court",[{definition:"It's your turn to act or decide.",example:"I've done my part — the ball is in your court now."}]),
    w("back to square one",[{definition:"Starting over after a failed attempt.",example:"The plan fell through, so we're back to square one."}]),
    w("get cold feet",[{definition:"Become nervous about doing something you had planned.",example:"She got cold feet right before the wedding."}]),
    w("hit the sack",[{definition:"Go to bed.",example:"It's late — I'm going to hit the sack."}]),
    w("kill two birds with one stone",[{definition:"Accomplish two things with a single action.",example:"I did my grocery shopping on the way to pick up the kids — killed two birds with one stone."}]),
    w("let the cat out of the bag",[{definition:"Reveal a secret accidentally.",example:"He let the cat out of the bag about the promotion."}]),
    w("miss the boat",[{definition:"Miss an opportunity.",example:"If you don't apply now, you'll miss the boat."}]),
    w("on thin ice",[{definition:"In a risky or precarious situation.",example:"After being late again, he's on thin ice with his boss."}]),
    w("over the moon",[{definition:"Extremely happy.",example:"She was over the moon about her exam results."}]),
    w("piece of cake",[{definition:"Very easy.",example:"The test was a piece of cake."}]),
    w("pull yourself together",[{definition:"Calm down and regain control of your emotions.",example:"Pull yourself together — we still have work to do."}]),
    w("see eye to eye",[{definition:"Agree with someone.",example:"They finally saw eye to eye on the budget."}]),
    w("sit on the fence",[{definition:"Avoid taking a side on an issue.",example:"He's been sitting on the fence about the decision for weeks."}]),
    w("speak of the devil",[{definition:"Said when someone appears right after being mentioned.",example:"Speak of the devil — I was just talking about you!"}]),
    w("the last straw",[{definition:"The final problem that makes someone lose patience.",example:"His constant lateness was the last straw."}]),
    w("throw in the towel",[{definition:"Give up.",example:"After three failed attempts, she threw in the towel."}])
  ],
  vocabulary: [
    w("skeptical",[{definition:"Doubting the truth or value of something.",example:"He was skeptical about the new diet plan."}]),
    w("inevitable",[{definition:"Certain to happen, unavoidable.",example:"Change was inevitable in the fast-growing company."}]),
    w("controversial",[{definition:"Causing public disagreement.",example:"The new policy was highly controversial."}]),
    w("meticulous",[{definition:"Extremely careful and precise about details.",example:"She's meticulous about checking her work."}]),
    w("ambiguous",[{definition:"Open to more than one interpretation.",example:"His answer was ambiguous, so we weren't sure what he meant."}]),
    w("resilient",[{definition:"Able to recover quickly from difficulties.",example:"Children are often more resilient than we expect."}]),
    w("pragmatic",[{definition:"Dealing with things practically rather than idealistically.",example:"We need a pragmatic solution, not a perfect one."}]),
    w("candid",[{definition:"Openly and honestly truthful, even if blunt.",example:"She gave a candid opinion about the project."}]),
    w("superficial",[{definition:"Only on the surface, not deep or thorough.",example:"His knowledge of the subject was superficial."}]),
    w("tedious",[{definition:"Long, boring, and repetitive.",example:"Filling out the forms was a tedious task."}]),
    w("versatile",[{definition:"Able to adapt to many different functions.",example:"This tool is versatile — it can be used for several tasks."},{definition:"Having many skills or abilities (of a person).",example:"She's a versatile actress who can play any role."}]),
    w("plausible",[{definition:"Seeming reasonable or probable.",example:"His excuse sounded plausible."}]),
    w("redundant",[{definition:"No longer needed, or unnecessarily repetitive.",example:"That sentence is redundant — you already said that."}]),
    w("subtle",[{definition:"Not obvious, delicate or precise.",example:"There was a subtle change in her tone."}]),
    w("tentative",[{definition:"Not certain or fixed, provisional.",example:"We made a tentative plan to meet next week."}]),
    w("arbitrary",[{definition:"Based on random choice rather than reason.",example:"The rule felt completely arbitrary."}]),
    w("coherent",[{definition:"Logical and consistent, easy to follow.",example:"He gave a coherent explanation of the events."}]),
    w("elusive",[{definition:"Difficult to find, catch, or achieve.",example:"Success remained elusive despite their efforts."}]),
    w("formidable",[{definition:"Inspiring fear or respect by being impressive or powerful.",example:"She's a formidable opponent in debate."}]),
    w("indispensable",[{definition:"Absolutely necessary, impossible to do without.",example:"Her experience makes her indispensable to the team."}]),
    w("intricate",[{definition:"Very detailed or complicated.",example:"The watch has an intricate mechanism."}]),
    w("notorious",[{definition:"Famous for something bad.",example:"The area is notorious for traffic jams."}]),
    w("obsolete",[{definition:"No longer used, outdated.",example:"That software is obsolete now."}]),
    w("prevalent",[{definition:"Widespread, common at a particular time or place.",example:"The disease is prevalent in that region."}]),
    w("profound",[{definition:"Very deep or intense.",example:"The book had a profound effect on me."}]),
    w("reluctant",[{definition:"Unwilling or hesitant to do something.",example:"He was reluctant to admit his mistake."}]),
    w("tangible",[{definition:"Able to be touched, or clearly real and definite.",example:"We need tangible proof, not just claims."}]),
    w("unprecedented",[{definition:"Never done or known before.",example:"The storm caused unprecedented damage."}]),
    w("viable",[{definition:"Capable of working successfully.",example:"Is this a viable business plan?"}]),
    w("volatile",[{definition:"Likely to change suddenly and unpredictably.",example:"The stock market has been volatile lately."},{definition:"Evaporating easily at room temperature (chemistry).",example:"The volatile chemical had to be stored carefully."}])
  ],
  debateTopics: [
    "AI should replace teachers.",
    "People should never retire.",
    "Everyone should own a garden.",
    "Social media does more harm than good.",
    "Money can buy happiness.",
    "Cities should ban cars from downtown.",
    "Everyone should learn a second language.",
    "Working from home is better than working in an office.",
    "Zoos should be abolished.",
    "College education should be free."
  ],
  taboo: [
    {target:"optimistic", forbidden:["hopeful","positive","future"]},
    {target:"generous", forbidden:["giving","kind","share"]},
    {target:"exhausted", forbidden:["tired","sleepy","energy"]},
    {target:"frustrated", forbidden:["annoyed","angry","upset"]},
    {target:"ambitious", forbidden:["goals","hardworking","driven"]},
    {target:"reliable", forbidden:["dependable","trust","consistent"]},
    {target:"awkward", forbidden:["weird","uncomfortable","strange"]},
    {target:"curious", forbidden:["interested","questions","wonder"]},
    {target:"stubborn", forbidden:["inflexible","opinion","change"]},
    {target:"humble", forbidden:["modest","arrogant","proud"]},
    {target:"nostalgic", forbidden:["memories","past","miss"]},
    {target:"controversial", forbidden:["debate","disagree","opinion"]},
    {target:"reckless", forbidden:["careless","dangerous","risk"]},
    {target:"resourceful", forbidden:["clever","solve","creative"]},
    {target:"blunt", forbidden:["honest","direct","rude"]}
  ],
  ladderStarters: [
    "I met my boss.","I went to the store.","I saw a dog.","I ate breakfast.",
    "I got a text.","I found a job.","I lost my keys.","I heard some news.",
    "I made a mistake.","I had a meeting."
  ]
};

let LISTS = null;
let currentTab = "story";
let currentDraw = {};
let editState = null; // {listKey, index (or null for new), word, meanings}

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}
function sample(arr,n){ return shuffle(arr).slice(0, Math.min(n, arr.length)); }
function pickOne(arr){ return arr[Math.floor(Math.random()*arr.length)]; }

async function loadLists(){
  try{
    const res = await window.storage.get(STORAGE_KEY, false);
    LISTS = JSON.parse(res.value);
    setStatus("lists loaded");
  }catch(e){
    LISTS = JSON.parse(JSON.stringify(DEFAULT_LISTS));
    await saveLists();
    setStatus("started with default lists");
  }
}
async function saveLists(){
  try{
    await window.storage.set(STORAGE_KEY, JSON.stringify(LISTS), false);
    setStatus("saved");
  }catch(e){
    setStatus("save failed — changes may not persist");
  }
}
function setStatus(msg){
  document.getElementById("status").textContent = msg;
}

const TAB_LABELS = {
  story:"Story Cubes", debate:"Debate Cards", taboo:"Taboo+",
  ladder:"Laddering", manage:"Manage Lists"
};

function renderTabs(){
  document.querySelectorAll("#tabs button").forEach(btn=>{
    btn.classList.toggle("active", btn.dataset.tab === currentTab);
  });
  document.getElementById("tabLabel").textContent = TAB_LABELS[currentTab];
}

function renderPanel(){
  const panel = document.getElementById("panel");
  if(currentTab === "story") panel.innerHTML = storyHTML();
  else if(currentTab === "debate") panel.innerHTML = debateHTML();
  else if(currentTab === "taboo") panel.innerHTML = tabooHTML();
  else if(currentTab === "ladder") panel.innerHTML = ladderHTML();
  else if(currentTab === "manage") panel.innerHTML = manageHTML();
  attachPanelHandlers();
}

function drawStory(){
  currentDraw.story = {
    theme: LISTS.themes.length ? pickOne(LISTS.themes) : null,
    pv: sample(LISTS.phrasalVerbs, 3),
    idioms: sample(LISTS.idioms, 2),
    vocab: sample(LISTS.vocabulary, 3)
  };
}
function storyHTML(){
  if(!currentDraw.story) drawStory();
  const d = currentDraw.story;
  return `
    <div class="card-index fresh">
      <div class="eyebrow">Story Cubes — tell it, then tell it again</div>
      <h2>${d.theme || "Add some themes in Manage Lists to get started."}</h2>
      ${tagGroup("Phrasal verbs", d.pv, "pv", "phrasalVerbs")}
      ${tagGroup("Idioms", d.idioms, "idiom", "idioms")}
      ${tagGroup("Vocabulary", d.vocab, "vocab", "vocabulary")}
    </div>
    <p class="hint">She improvises a story on the theme, working in every expression. Tap any word to see its definition and an example. Interrupt with follow-up questions, then have her tell the whole story a second time.</p>
    <button class="draw-btn" id="reroll">Draw new cubes</button>
  `;
}

function drawDebate(){
  currentDraw.debate = {
    topic: LISTS.debateTopics.length ? pickOne(LISTS.debateTopics) : null,
    pv: sample(LISTS.phrasalVerbs, 4),
    idioms: sample(LISTS.idioms, 3),
    vocab: sample(LISTS.vocabulary, 5)
  };
}
function debateHTML(){
  if(!currentDraw.debate) drawDebate();
  const d = currentDraw.debate;
  return `
    <div class="card-index fresh">
      <div class="eyebrow">Debate Cards</div>
      <h2>${d.topic || "Add debate topics in Manage Lists to get started."}</h2>
      ${tagGroup("Must use — phrasal verbs", d.pv, "pv", "phrasalVerbs")}
      ${tagGroup("Must use — idioms", d.idioms, "idiom", "idioms")}
      ${tagGroup("Must use — vocabulary", d.vocab, "vocab", "vocabulary")}
    </div>
    <p class="hint">She argues one side and has to naturally land every required expression. Tap a word to check its meaning before she starts.</p>
    <button class="draw-btn" id="reroll">Draw new card</button>
  `;
}

function drawTaboo(){
  currentDraw.taboo = LISTS.taboo.length ? pickOne(LISTS.taboo) : null;
}
function tabooHTML(){
  if(!("taboo" in currentDraw)) drawTaboo();
  const d = currentDraw.taboo;
  if(!d){
    return `<div class="card-index fresh"><div class="eyebrow">Taboo+</div><p class="empty-hint">Add taboo words in Manage Lists to get started.</p></div>
    <button class="draw-btn" id="reroll">Draw new card</button>`;
  }
  return `
    <div class="card-index fresh">
      <div class="eyebrow">Taboo+ — explain it without these</div>
      <div class="taboo-target">${d.target}</div>
      <div class="group-label">Forbidden words</div>
      <ul class="forbidden-list">
        ${d.forbidden.map(wd=>`<li>${wd}</li>`).join("")}
      </ul>
    </div>
    <p class="hint">She has to define or explain the target word out loud without using any of the forbidden words.</p>
    <button class="draw-btn" id="reroll">Draw new card</button>
  `;
}

function drawLadder(){
  currentDraw.ladder = {
    starter: LISTS.ladderStarters.length ? pickOne(LISTS.ladderStarters) : "I met my boss.",
    pv: LISTS.phrasalVerbs.length ? pickOne(LISTS.phrasalVerbs) : null,
    idiom: LISTS.idioms.length ? pickOne(LISTS.idioms) : null,
    vocab: LISTS.vocabulary.length ? pickOne(LISTS.vocabulary) : null
  };
}
function ladderHTML(){
  if(!currentDraw.ladder) drawLadder();
  const d = currentDraw.ladder;
  return `
    <div class="card-index fresh">
      <div class="eyebrow">Laddering — build the sentence up</div>
      <h2>"${d.starter}"</h2>
      <div class="group-label">Work these in, one rung at a time</div>
      <ol class="ladder-steps">
        <li>Add a detail (where, when, who).</li>
        <li>Add a reaction or feeling.</li>
        <li>Insert the phrasal verb: ${d.pv ? `<strong data-list="phrasalVerbs" data-text="${escAttr(d.pv.text)}">${d.pv.text}</strong>` : "—"}</li>
        <li>Insert the idiom: ${d.idiom ? `<strong data-list="idioms" data-text="${escAttr(d.idiom.text)}">${d.idiom.text}</strong>` : "—"}</li>
        <li>Insert the vocabulary word: ${d.vocab ? `<strong data-list="vocabulary" data-text="${escAttr(d.vocab.text)}">${d.vocab.text}</strong>` : "—"}</li>
      </ol>
    </div>
    <p class="hint">Start with the plain sentence and rebuild it out loud rung by rung. Tap any bold word to check its meaning.</p>
    <button class="draw-btn" id="reroll">Draw new sentence</button>
  `;
}

function escAttr(s){ return String(s).replace(/"/g,"&quot;"); }

function tagGroup(label, items, cls, listKey){
  if(!items || !items.length){
    return `<div class="group-label">${label}</div><p class="empty-hint">not enough items in this list yet</p>`;
  }
  return `<div class="group-label">${label}</div><div class="tagrow">${items.map(it=>`<button type="button" class="tag ${cls}" data-list="${listKey}" data-text="${escAttr(it.text)}">${it.text}</button>`).join("")}</div>`;
}

const SIMPLE_LISTS = [
  {key:"themes", label:"Story themes"},
  {key:"debateTopics", label:"Debate topics"},
  {key:"ladderStarters", label:"Laddering starter sentences"}
];
const WORD_LISTS = [
  {key:"phrasalVerbs", label:"Phrasal verbs"},
  {key:"idioms", label:"Idioms"},
  {key:"vocabulary", label:"Vocabulary"}
];

function manageHTML(){
  let html = `<div class="manage-grid">`;

  WORD_LISTS.forEach(sec=>{
    const items = LISTS[sec.key];
    html += `
      <div class="manage-section">
        <h3>${sec.label} <span class="count">(${items.length})</span></h3>
        <p class="hint" style="margin-top:0;">Tap a word to view or edit its definitions and examples.</p>
        <div class="chip-list">
          ${items.map((it,i)=>`<span class="chip" data-editlist="${sec.key}" data-editidx="${i}">${it.text}<button data-list="${sec.key}" data-idx="${i}" class="del-word">×</button></span>`).join("") || `<span class="empty-hint">none yet</span>`}
        </div>
        <button class="add-word-btn" data-newword="${sec.key}">+ Add a new ${sec.label.toLowerCase().replace(/s$/,'')}</button>
      </div>
    `;
  });

  SIMPLE_LISTS.forEach(sec=>{
    const items = LISTS[sec.key];
    html += `
      <div class="manage-section">
        <h3>${sec.label} <span class="count">(${items.length})</span></h3>
        <div class="chip-list">
          ${items.map((it,i)=>`<span class="chip">${it}<button data-list="${sec.key}" data-idx="${i}" class="del-simple">×</button></span>`).join("") || `<span class="empty-hint">none yet</span>`}
        </div>
        <div class="add-row">
          <input type="text" data-add="${sec.key}" placeholder="Add to ${sec.label.toLowerCase()}…">
          <button data-addbtn="${sec.key}">Add</button>
        </div>
      </div>
    `;
  });

  html += `
    <div class="manage-section">
      <h3>Taboo+ words <span class="count">(${LISTS.taboo.length})</span></h3>
      ${LISTS.taboo.map((t,i)=>`
        <div class="taboo-manage-item">
          <div><strong>${t.target}</strong> — <span class="fb">${t.forbidden.join(", ")}</span></div>
          <button data-del-taboo="${i}">×</button>
        </div>
      `).join("") || `<p class="empty-hint">none yet</p>`}
      <div class="add-row" style="margin-top:8px;">
        <input type="text" id="tabooTarget" placeholder="Target word (e.g. optimistic)">
      </div>
      <div class="add-row" style="margin-top:8px;">
        <input type="text" id="tabooForbidden" placeholder="Forbidden words, comma-separated">
        <button id="addTabooBtn">Add</button>
      </div>
    </div>
  `;
  html += `</div>`;
  return html;
}

// ---------- MODAL: view mode ----------
function openViewModal(listKey, text){
  const item = LISTS[listKey].find(it=>it.text===text);
  if(!item) return;
  const overlay = document.getElementById("modalOverlay");
  const card = document.getElementById("modalCard");
  card.innerHTML = `
    <button class="modal-close" id="modalCloseBtn">&times;</button>
    <div class="eyebrow">${listKey === "phrasalVerbs" ? "Phrasal verb" : listKey === "idioms" ? "Idiom" : "Vocabulary"}</div>
    <h2>${item.text}</h2>
    ${item.meanings.map((m,i)=>`
      <div class="meaning-block">
        ${item.meanings.length>1 ? `<div class="meaning-num">Meaning ${i+1}</div>` : ``}
        <div class="meaning-def">${m.definition}</div>
        <div class="meaning-ex">"${m.example}"</div>
      </div>
    `).join("")}
  `;
  overlay.classList.remove("hidden");
  document.getElementById("modalCloseBtn").addEventListener("click", closeModal);
}

// ---------- MODAL: edit mode ----------
function openEditModal(listKey, index){
  const isNew = index === null;
  const source = isNew ? {text:"", meanings:[{definition:"",example:""}]} : LISTS[listKey][index];
  editState = {listKey, index, text: source.text, meanings: source.meanings.map(m=>({...m}))};
  renderEditModal();
  document.getElementById("modalOverlay").classList.remove("hidden");
}

function renderEditModal(){
  const card = document.getElementById("modalCard");
  const label = editState.listKey === "phrasalVerbs" ? "phrasal verb" : editState.listKey === "idioms" ? "idiom" : "vocabulary word";
  card.innerHTML = `
    <button class="modal-close" id="modalCloseBtn">&times;</button>
    <div class="eyebrow">${editState.index===null ? "Add" : "Edit"} ${label}</div>
    <div class="edit-field">
      <label>Word or phrase</label>
      <input type="text" id="editWordText" value="${escAttr(editState.text)}">
    </div>
    <div id="meaningsContainer">
      ${editState.meanings.map((m,i)=>`
        <div class="meaning-block">
          <div class="meaning-num">Meaning ${i+1} ${editState.meanings.length>1 ? `<button class="remove-meaning-btn" data-removemeaning="${i}">remove</button>` : ``}</div>
          <div class="edit-field">
            <label>Definition</label>
            <textarea rows="2" data-meaningfield="definition" data-meaningidx="${i}">${m.definition}</textarea>
            <label>Example sentence</label>
            <input type="text" data-meaningfield="example" data-meaningidx="${i}" value="${escAttr(m.example)}">
          </div>
        </div>
      `).join("")}
    </div>
    <button class="add-word-btn" id="addMeaningBtn">+ Add another meaning</button>
    <div class="modal-actions">
      <button class="btn-primary" id="saveEditBtn">Save</button>
      <button class="btn-ghost" id="cancelEditBtn">Cancel</button>
      ${editState.index!==null ? `<button class="btn-danger" id="deleteEditBtn">Delete word</button>` : ``}
    </div>
  `;
  document.getElementById("modalCloseBtn").addEventListener("click", closeModal);
  document.getElementById("cancelEditBtn").addEventListener("click", closeModal);
  document.getElementById("editWordText").addEventListener("input", e=>{ editState.text = e.target.value; });
  document.querySelectorAll("[data-meaningfield]").forEach(el=>{
    el.addEventListener("input", e=>{
      const idx = parseInt(e.target.dataset.meaningidx,10);
      const field = e.target.dataset.meaningfield;
      editState.meanings[idx][field] = e.target.value;
    });
  });
  document.querySelectorAll("[data-removemeaning]").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      const idx = parseInt(btn.dataset.removemeaning,10);
      editState.meanings.splice(idx,1);
      renderEditModal();
    });
  });
  document.getElementById("addMeaningBtn").addEventListener("click", ()=>{
    editState.meanings.push({definition:"",example:""});
    renderEditModal();
  });
  document.getElementById("saveEditBtn").addEventListener("click", async ()=>{
    const cleanText = editState.text.trim();
    const cleanMeanings = editState.meanings
      .map(m=>({definition:m.definition.trim(), example:m.example.trim()}))
      .filter(m=>m.definition || m.example);
    if(!cleanText || !cleanMeanings.length){
      setStatus("word and at least one definition are required");
      return;
    }
    const newItem = {text:cleanText, meanings:cleanMeanings};
    if(editState.index===null){
      LISTS[editState.listKey].push(newItem);
    }else{
      LISTS[editState.listKey][editState.index] = newItem;
    }
    await saveLists();
    closeModal();
    renderPanel();
  });
  const delBtn = document.getElementById("deleteEditBtn");
  if(delBtn){
    delBtn.addEventListener("click", async ()=>{
      LISTS[editState.listKey].splice(editState.index,1);
      await saveLists();
      closeModal();
      renderPanel();
    });
  }
}

function closeModal(){
  document.getElementById("modalOverlay").classList.add("hidden");
  editState = null;
}

document.getElementById("modalOverlay").addEventListener("click", e=>{
  if(e.target.id === "modalOverlay") closeModal();
});

function attachPanelHandlers(){
  const reroll = document.getElementById("reroll");
  if(reroll){
    reroll.addEventListener("click", ()=>{
      if(currentTab==="story") drawStory();
      if(currentTab==="debate") drawDebate();
      if(currentTab==="taboo") drawTaboo();
      if(currentTab==="ladder") drawLadder();
      renderPanel();
    });
  }

  document.querySelectorAll(".tag[data-list], strong[data-list]").forEach(el=>{
    el.addEventListener("click", ()=>{
      openViewModal(el.dataset.list, el.dataset.text);
    });
  });

  if(currentTab === "manage"){
    document.querySelectorAll(".del-simple").forEach(btn=>{
      btn.addEventListener("click", async (e)=>{
        e.stopPropagation();
        const key = btn.dataset.list, idx = parseInt(btn.dataset.idx,10);
        LISTS[key].splice(idx,1);
        await saveLists();
        renderPanel();
      });
    });
    document.querySelectorAll(".del-word").forEach(btn=>{
      btn.addEventListener("click", async (e)=>{
        e.stopPropagation();
        const key = btn.dataset.list, idx = parseInt(btn.dataset.idx,10);
        LISTS[key].splice(idx,1);
        await saveLists();
        renderPanel();
      });
    });
    document.querySelectorAll(".chip[data-editlist]").forEach(chip=>{
      chip.addEventListener("click", ()=>{
        openEditModal(chip.dataset.editlist, parseInt(chip.dataset.editidx,10));
      });
    });
    document.querySelectorAll("[data-newword]").forEach(btn=>{
      btn.addEventListener("click", ()=>{
        openEditModal(btn.dataset.newword, null);
      });
    });
    SIMPLE_LISTS.forEach(sec=>{
      const btn = document.querySelector(`[data-addbtn="${sec.key}"]`);
      const input = document.querySelector(`[data-add="${sec.key}"]`);
      const submit = async ()=>{
        const val = input.value.trim();
        if(!val) return;
        LISTS[sec.key].push(val);
        input.value = "";
        await saveLists();
        renderPanel();
      };
      if(btn) btn.addEventListener("click", submit);
      if(input) input.addEventListener("keydown", e=>{ if(e.key==="Enter") submit(); });
    });
    document.querySelectorAll("[data-del-taboo]").forEach(btn=>{
      btn.addEventListener("click", async ()=>{
        const idx = parseInt(btn.dataset.delTaboo,10);
        LISTS.taboo.splice(idx,1);
        await saveLists();
        renderPanel();
      });
    });
    const addTabooBtn = document.getElementById("addTabooBtn");
    if(addTabooBtn){
      addTabooBtn.addEventListener("click", async ()=>{
        const target = document.getElementById("tabooTarget").value.trim();
        const forbiddenRaw = document.getElementById("tabooForbidden").value.trim();
        if(!target || !forbiddenRaw) return;
        const forbidden = forbiddenRaw.split(",").map(s=>s.trim()).filter(Boolean);
        LISTS.taboo.push({target, forbidden});
        await saveLists();
        renderPanel();
      });
    }
  }
}

document.querySelectorAll("#tabs button").forEach(btn=>{
  btn.addEventListener("click", ()=>{
    currentTab = btn.dataset.tab;
    renderTabs();
    renderPanel();
  });
});

(async function init(){
  await loadLists();
  renderTabs();
  renderPanel();
})();
</script>
</body>
</html>
