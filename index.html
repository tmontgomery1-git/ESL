<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ESL Card Box</title>
<link rel="icon" type="image/png" href="ESL_Icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@400;500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#1B2A41;
    --teal:#2A8F82;
    --gold:#D79A3B;
    --cream:#F7F3E9;
    --card-line:#DCD4BE;
    --card-margin:#C1544A;
    --ink-light:#5B6B7A;
    --paper:#FFFDF7;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--cream);
    font-family:'Inter',sans-serif;
    color:var(--navy);
    min-height:100vh;
    padding:28px 16px 60px;
  }
  .wrap{max-width:760px;margin:0 auto;}

  header.top{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    margin-bottom:22px;
    border-bottom:3px solid var(--navy);
    padding-bottom:12px;
  }
  header.top h1{
    font-family:'Zilla Slab',serif;
    font-weight:700;
    font-size:1.9rem;
    margin:0;
    letter-spacing:-0.01em;
  }
  header.top span{
    font-family:'IBM Plex Mono',monospace;
    font-size:0.72rem;
    color:var(--ink-light);
    text-transform:uppercase;
    letter-spacing:0.08em;
  }

  nav.tabs{
    display:flex;
    gap:6px;
    margin-bottom:18px;
    flex-wrap:wrap;
  }
  nav.tabs button{
    font-family:'IBM Plex Mono',monospace;
    font-size:0.75rem;
    letter-spacing:0.04em;
    text-transform:uppercase;
    background:var(--paper);
    border:1.5px solid var(--card-line);
    border-bottom:none;
    color:var(--ink-light);
    padding:9px 14px;
    border-radius:6px 6px 0 0;
    cursor:pointer;
    position:relative;
    top:1px;
  }
  nav.tabs button.active{
    background:var(--navy);
    color:var(--cream);
    border-color:var(--navy);
  }

  .panel{
    background:var(--paper);
    border:1.5px solid var(--card-line);
    border-radius:4px;
    padding:26px;
    position:relative;
  }

  .card-index{
    background:
      repeating-linear-gradient(var(--paper), var(--paper) 27px, var(--card-line) 28px, var(--paper) 29px);
    border:1.5px solid var(--card-line);
    border-left:4px solid var(--card-margin);
    border-radius:2px;
    padding:22px 24px 22px 30px;
    min-height:220px;
    position:relative;
    box-shadow:3px 3px 0 rgba(27,42,65,0.06), 6px 6px 0 rgba(27,42,65,0.03);
  }
  .card-index .eyebrow{
    font-family:'IBM Plex Mono',monospace;
    font-size:0.68rem;
    text-transform:uppercase;
    letter-spacing:0.1em;
    color:var(--teal);
    margin-bottom:6px;
  }
  .card-index h2{
    font-family:'Zilla Slab',serif;
    font-size:1.5rem;
    margin:0 0 16px;
    line-height:1.3;
  }
  .tagrow{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px;}
  .tag{
    font-family:'IBM Plex Mono',monospace;
    font-size:0.78rem;
    padding:5px 10px;
    border-radius:14px;
    border:1.3px solid currentColor;
    white-space:nowrap;
    cursor:pointer;
    background:none;
  }
  .tag:hover{background:rgba(27,42,65,0.06);}
  .tag.pv{color:var(--teal);}
  .tag.idiom{color:var(--gold);}
  .tag.vocab{color:var(--navy);}
  .group-label{
    font-family:'IBM Plex Mono',monospace;
    font-size:0.68rem;
    text-transform:uppercase;
    letter-spacing:0.08em;
    color:var(--ink-light);
    margin:14px 0 6px;
  }
  .empty-hint{color:var(--ink-light);font-size:0.9rem;font-style:italic;}

  .draw-btn{
    font-family:'IBM Plex Mono',monospace;
    text-transform:uppercase;
    letter-spacing:0.06em;
    font-size:0.85rem;
    background:var(--navy);
    color:var(--cream);
    border:none;
    padding:12px 22px;
    border-radius:5px;
    cursor:pointer;
    margin-top:18px;
  }
  .draw-btn:hover{background:#101c2e;}

  @keyframes pullCard{
    0%{transform:translateY(-14px) rotate(-1.2deg);opacity:0;}
    100%{transform:translateY(0) rotate(0deg);opacity:1;}
  }
  .card-index.fresh{animation:pullCard 0.28s ease-out;}

  .taboo-target{
    font-family:'Zilla Slab',serif;
    font-weight:700;
    font-size:2.1rem;
    color:var(--navy);
    margin:4px 0 18px;
  }
  .forbidden-list{list-style:none;padding:0;margin:0;}
  .forbidden-list li{
    font-family:'IBM Plex Mono',monospace;
    font-size:0.95rem;
    color:var(--card-margin);
    text-decoration:line-through;
    padding:4px 0;
  }

  .ladder-steps{margin-top:16px;padding-left:0;list-style:none;}
  .ladder-steps li{
    font-family:'Inter',sans-serif;
    font-size:0.92rem;
    color:var(--ink-light);
    padding:6px 0 6px 20px;
    border-left:2px solid var(--card-line);
    margin-left:6px;
  }
  .ladder-steps li strong{color:var(--navy);cursor:pointer;text-decoration:underline dotted;}

  p.hint{color:var(--ink-light);font-size:0.88rem;line-height:1.5;margin-top:4px;}

  .manage-grid{display:grid;grid-template-columns:1fr;gap:22px;}
  .manage-section h3{
    font-family:'Zilla Slab',serif;
    font-size:1.15rem;
    margin:0 0 4px;
    display:flex;
    align-items:center;
    gap:8px;
  }
  .manage-section h3 .count{
    font-family:'IBM Plex Mono',monospace;
    font-size:0.7rem;
    color:var(--ink-light);
    font-weight:400;
  }
  .chip-list{display:flex;flex-wrap:wrap;gap:7px;margin:10px 0 12px;}
  .chip{
    display:flex;align-items:center;gap:6px;
    background:var(--cream);
    border:1.2px solid var(--card-line);
    border-radius:14px;
    padding:5px 6px 5px 12px;
    font-size:0.85rem;
    cursor:pointer;
  }
  .chip:hover{border-color:var(--navy);}
  .chip button{
    background:none;border:none;color:var(--card-margin);
    cursor:pointer;font-size:0.95rem;line-height:1;padding:2px 4px;
  }
  .add-row{display:flex;gap:8px;}
  .add-row input{
    flex:1;
    font-family:'Inter',sans-serif;
    font-size:0.9rem;
    padding:8px 10px;
    border:1.3px solid var(--card-line);
    border-radius:5px;
    background:var(--paper);
  }
  .add-row button{
    font-family:'IBM Plex Mono',monospace;
    font-size:0.8rem;
    background:var(--teal);
    color:white;
    border:none;
    border-radius:5px;
    padding:0 16px;
    cursor:pointer;
  }
  .add-word-btn{
    font-family:'IBM Plex Mono',monospace;
    font-size:0.78rem;
    background:none;
    border:1.3px dashed var(--card-line);
    color:var(--ink-light);
    border-radius:6px;
    padding:8px 12px;
    cursor:pointer;
    margin-top:2px;
  }
  .add-word-btn:hover{border-color:var(--navy);color:var(--navy);}
  .taboo-manage-item{
    border:1.2px solid var(--card-line);
    border-radius:6px;
    padding:10px 12px;
    margin-bottom:8px;
    font-size:0.88rem;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
  }
  .taboo-manage-item .fb{color:var(--ink-light);font-size:0.8rem;}
  .taboo-manage-item button{
    background:none;border:none;color:var(--card-margin);cursor:pointer;font-size:1rem;
  }

  footer.status{
    text-align:center;
    font-family:'IBM Plex Mono',monospace;
    font-size:0.7rem;
    color:var(--ink-light);
    margin-top:16px;
  }

  /* modal */
  .modal-overlay{
    position:fixed;inset:0;
    background:rgba(27,42,65,0.45);
    display:flex;align-items:center;justify-content:center;
    padding:20px;
    z-index:50;
  }
  .modal-overlay.hidden{display:none;}
  .hidden{display:none;}
  .defaults-banner{
    display:flex;align-items:center;gap:12px;flex-wrap:wrap;
    background:#FBF1DD;border:1.5px solid var(--gold);border-radius:6px;
    padding:9px 14px;margin:0 0 14px;font-size:0.86rem;color:var(--navy);
  }
  .defaults-banner.hidden{display:none;margin:0;padding:0;border:none;}
  .defaults-banner button{
    border:1.3px solid var(--card-line);border-radius:5px;padding:5px 10px;
    font-family:inherit;font-size:0.8rem;cursor:pointer;background:var(--paper);
  }
  .defaults-banner .btn-primary{background:var(--navy);color:var(--cream);border-color:var(--navy);}
  .modal-card{
    max-width:480px;width:100%;
    max-height:85vh;
    overflow-y:auto;
  }
  .modal-close{
    position:absolute;top:10px;right:14px;
    background:none;border:none;font-size:1.3rem;
    color:var(--ink-light);cursor:pointer;
  }
  .meaning-block{margin-bottom:14px;padding-bottom:12px;border-bottom:1px dashed var(--card-line);}
  .meaning-block:last-of-type{border-bottom:none;}
  .meaning-num{
    font-family:'IBM Plex Mono',monospace;
    font-size:0.68rem;color:var(--teal);text-transform:uppercase;letter-spacing:0.06em;
  }
  .meaning-def{font-size:0.98rem;margin:4px 0 6px;}
  .meaning-ex{font-size:0.92rem;color:var(--ink-light);font-style:italic;}
  .modal-actions{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap;}
  .modal-actions button{
    font-family:'IBM Plex Mono',monospace;
    font-size:0.78rem;
    border-radius:5px;
    padding:9px 14px;
    cursor:pointer;
    border:1.3px solid var(--navy);
  }
  .btn-primary{background:var(--navy);color:var(--cream);}
  .btn-ghost{background:none;color:var(--navy);}
  .btn-danger{background:none;color:var(--card-margin);border-color:var(--card-margin);}
  .edit-field label{
    font-family:'IBM Plex Mono',monospace;
    font-size:0.68rem;text-transform:uppercase;letter-spacing:0.06em;
    color:var(--ink-light);display:block;margin-bottom:4px;
  }
  .edit-field input, .edit-field textarea{
    width:100%;font-family:'Inter',sans-serif;font-size:0.92rem;
    padding:7px 9px;border:1.3px solid var(--card-line);border-radius:5px;
    margin-bottom:10px;background:var(--paper);resize:vertical;
  }
  .remove-meaning-btn{
    font-family:'IBM Plex Mono',monospace;font-size:0.7rem;
    background:none;border:none;color:var(--card-margin);cursor:pointer;
  }

  .profile-bar{
    display:flex;align-items:center;gap:8px;flex-wrap:wrap;
    margin-bottom:16px;
    font-family:'IBM Plex Mono',monospace;
    font-size:0.78rem;
  }
  .profile-bar label{color:var(--ink-light);text-transform:uppercase;letter-spacing:0.06em;font-size:0.68rem;}
  .profile-bar select{
    font-family:'Inter',sans-serif;font-size:0.88rem;
    padding:6px 8px;border:1.3px solid var(--card-line);border-radius:5px;
    background:var(--paper);color:var(--navy);
  }
  .profile-bar button{
    font-family:'IBM Plex Mono',monospace;font-size:0.7rem;
    background:none;border:1.3px solid var(--card-line);color:var(--ink-light);
    border-radius:5px;padding:6px 9px;cursor:pointer;
  }
  .profile-bar button:hover{border-color:var(--navy);color:var(--navy);}
  .profile-bar .spacer{flex:1;}

  /* print-set builder */
  .print-set-list{display:flex;flex-direction:column;gap:8px;margin:12px 0 4px;}
  .print-set-item{
    display:flex;align-items:center;gap:10px;
    border:1.2px solid var(--card-line);border-radius:6px;
    padding:9px 10px;background:var(--cream);
  }
  .print-set-item .set-num{
    font-family:'IBM Plex Mono',monospace;font-size:.72rem;color:var(--ink-light);
    min-width:24px;
  }
  .print-set-item .set-title{flex:1;font-weight:600;}
  .print-set-item .set-type{
    font-family:'IBM Plex Mono',monospace;font-size:.66rem;text-transform:uppercase;
    color:var(--teal);letter-spacing:.05em;
  }
  .print-set-item button{
    background:none;border:none;color:var(--card-margin);cursor:pointer;font-size:1rem;
  }
  .exercise-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;}
  .exercise-actions .draw-btn{margin-top:0;}
  @media print{
    body{background:white;padding:0;}
    .wrap,.modal-overlay{display:none !important;}
  }
</style>
</head>
<body>
<div class="wrap">

  <header class="top">
    <h1>Speaking Card Box</h1>
    <span id="tabLabel">Story Cubes</span>
  </header>

  <div class="profile-bar" id="profileBar">
    <label>Student</label>
    <select id="profileSelect"></select>
    <button id="newProfileBtn">+ New</button>
    <button id="renameProfileBtn">Rename</button>
    <button id="deleteProfileBtn">Delete</button>
    <span class="spacer"></span>
    <button id="exportProfileBtn">Export student file</button>
    <button id="importProfileBtn">Import file</button>
    <button id="printSetBtn">Print set (0)</button>
    <input type="file" id="importFileInput" accept="application/json" style="display:none">
  </div>

  <div class="defaults-banner hidden" id="defaultsBanner"></div>

  <nav class="tabs" id="tabs">
    <button data-tab="story" class="active">Story Cubes</button>
    <button data-tab="debate">Debate Cards</button>
    <button data-tab="taboo">Taboo+</button>
    <button data-tab="ladder">Laddering</button>
    <button data-tab="warmup">Warmup Review</button>
    <button data-tab="manage">Manage Lists</button>
  </nav>

  <div class="panel" id="panel"></div>

  <footer class="status" id="status">loading your lists…</footer>
</div>

<div class="modal-overlay hidden" id="modalOverlay">
  <div class="modal-card card-index" id="modalCard" style="position:relative;"></div>
</div>

<script>
const PROFILE_INDEX_KEY = "esl-toolkit-profiles-v1";
const LAST_PROFILE_KEY = "esl-toolkit-last-profile-v1";
function dataKey(name){ return "esl-toolkit-data-v1::" + name; }

function w(text, meanings, freqRank){ return {text, meanings, rating:null, freqRank: (typeof freqRank==="number"?freqRank:null)}; }

const DEFAULT_LISTS = {
  themes: [
    "You accidentally became famous.",
    "You are trying to convince your friend to quit their job.",
    "You discovered a hidden talent.",
    "You got lost in a foreign city.",
    "You witnessed something strange at work.",
    "You have to give a toast at a wedding.",
    "You're moving to a new country.",
    "You found out a secret about a friend.",
    "You have to cancel plans at the last minute.",
    "You're starting a new hobby.",
    "You had an embarrassing moment in public.",
    "You're negotiating a raise.",
    "You're meeting your partner's parents for the first time.",
    "You're stuck in a long delay at the airport."
  ],
  phrasalVerbs: [
    w("get up", [{"definition": "Rise from bed", "example": "I get up at 6am every day."}]),
    w("go on", [{"definition": "Continue doing or talking about something", "example": "Please go on with your story."}, {"definition": "Start or begin functioning", "example": "The lights suddenly went on."}]),
    w("come back", [{"definition": "Return to a place or situation", "example": "She'll come back next week."}]),
    w("find out", [{"definition": "Discover or learn information", "example": "Let me find out what happened."}]),
    w("go back", [{"definition": "Return to a previous place or situation", "example": "We need to go back to the office."}]),
    w("come on", [{"definition": "Used to encourage someone to hurry or act", "example": "Come on. We're going to be late."}, {"definition": "Start operating or functioning", "example": "The heater came on automatically."}]),
    w("go out", [{"definition": "Leave home to socialize or spend time away from home", "example": "Do you want to go out tonight?"}, {"definition": "Stop burning or shining", "example": "The fire went out overnight."}]),
    w("come out", [{"definition": "Become known or revealed", "example": "The truth finally came out."}, {"definition": "Be released or made available to the public", "example": "The new movie comes out Friday."}]),
    w("go up", [{"definition": "Increase in amount, level, or price", "example": "Prices keep going up."}, {"definition": "Be built or constructed", "example": "A new building went up downtown."}]),
    w("pick up", [{"definition": "Buy or collect something from a place", "example": "Can you pick up some milk?"}, {"definition": "Learn or acquire a skill or language informally", "example": "She picked up French quickly living there."}]),
    w("go down", [{"definition": "Decrease in amount, level, or price", "example": "Sales went down last quarter."}, {"definition": "Sink or be destroyed underwater", "example": "The ship went down in the storm."}]),
    w("sit down", [{"definition": "Move into a sitting position", "example": "Please sit down and relax."}]),
    w("come up", [{"definition": "Happen unexpectedly or arise", "example": "Something came up at work."}, {"definition": "Be mentioned or raised in conversation", "example": "The topic came up in conversation."}]),
    w("grow up", [{"definition": "Develop from a child into an adult", "example": "She grew up in Chicago."}]),
    w("end up", [{"definition": "Eventually be in a particular situation or place", "example": "We ended up staying home."}]),
    w("carry out", [{"definition": "Perform or complete a plan, task, or instruction", "example": "They carried out the plan."}]),
    w("point out", [{"definition": "Draw attention to something", "example": "Let me point out one issue."}]),
    w("set up", [{"definition": "Arrange or organize something so that it is ready", "example": "Can you set up the meeting?"}, {"definition": "Trick or frame someone by deliberately putting them in a compromising situation", "example": "He was set up by his own partner."}]),
    w("look up", [{"definition": "Search for information in a reference source or online", "example": "I'll look it up online."}, {"definition": "Improve or become more successful / admire and respect someone (look up to)", "example": "Business is finally looking up. / She looks up to her mentor (look up to)."}]),
    w("turn out", [{"definition": "Develop or prove to be a particular way", "example": "It turned out fine."}, {"definition": "Appear or attend an event in large numbers", "example": "A big crowd turned out for the event."}]),
    w("work out", [{"definition": "Develop successfully or have a successful result", "example": "It worked out in the end."}, {"definition": "Exercise, especially at a gym", "example": "He works out at the gym every morning."}]),
    w("take on", [{"definition": "Accept responsibility, work, or a task", "example": "He took on more responsibility."}, {"definition": "Hire or employ new workers", "example": "The company is taking on new staff."}]),
    w("go through", [{"definition": "Read, examine, or experience something from beginning to end", "example": "I went through the report."}, {"definition": "Be successfully completed or approved", "example": "The deal finally went through."}]),
    w("move on", [{"definition": "Stop focusing on something and continue to a new situation", "example": "It's time to move on."}]),
    w("figure out", [{"definition": "Understand or find a solution to something", "example": "Let's figure out a solution."}]),
    w("break down", [{"definition": "Stop working because of a mechanical or other failure", "example": "The car broke down on the highway."}, {"definition": "Become extremely upset and cry / analyze something by separating it into smaller parts", "example": "She broke down in tears. / Let's break down the costs."}]),
    w("bring up", [{"definition": "Mention a topic or subject in conversation", "example": "She brought up an important point."}, {"definition": "Raise or care for a child until adulthood", "example": "He was brought up by his grandparents."}]),
    w("call back", [{"definition": "Return someone's telephone call", "example": "I'll call you back later."}]),
    w("check out", [{"definition": "Look at or examine something because it seems interesting", "example": "Let's check out that new restaurant."}, {"definition": "Leave a hotel after completing your stay", "example": "Please check out of the hotel by noon."}]),
    w("clean up", [{"definition": "Make a place clean and orderly", "example": "We need to clean up the kitchen."}, {"definition": "Perform very successfully or win decisively", "example": "He cleaned up in the tournament (won big)."}]),
    w("come in", [{"definition": "Enter a place", "example": "Please come in and sit down."}, {"definition": "Arrive or be received, such as results or information", "example": "The results are starting to come in."}]),
    w("come along", [{"definition": "Accompany someone", "example": "Do you want to come along?"}, {"definition": "Progress or develop", "example": "Her recovery is coming along well."}]),
    w("cut down", [{"definition": "Reduce the amount of something", "example": "I'm trying to cut down on sugar."}, {"definition": "Fell a tree by cutting through its trunk", "example": "They cut down the old tree."}]),
    w("drop off", [{"definition": "Take someone or something to a place and leave them there", "example": "I'll drop off the package."}, {"definition": "Fall asleep", "example": "He dropped off to sleep on the couch."}]),
    w("fall apart", [{"definition": "Break into pieces or stop holding together", "example": "The old chair fell apart."}, {"definition": "Collapse or fail as a relationship or organization", "example": "Their friendship fell apart after the move."}]),
    w("fill out", [{"definition": "Complete a form by providing the requested information", "example": "Please fill out this form."}]),
    w("get along", [{"definition": "Have a friendly relationship with someone", "example": "They get along really well."}]),
    w("get away", [{"definition": "Leave a place, especially to take a break or escape", "example": "We need to get away for the weekend."}, {"definition": "Escape punishment for something wrong", "example": "He got away with the theft."}]),
    w("get back", [{"definition": "Return to a place", "example": "When did you get back from the trip?"}, {"definition": "Return a response or contact someone later", "example": "I'll get back to you tomorrow."}]),
    w("get by", [{"definition": "Manage to live or function with limited resources", "example": "We can get by on this budget."}]),
    w("get over", [{"definition": "Recover from an illness or difficult experience", "example": "It took her a while to get over the flu."}, {"definition": "Recover emotionally from a breakup", "example": "He never got over the breakup."}]),
    w("give up", [{"definition": "Stop trying or stop doing something", "example": "Don't give up now."}, {"definition": "Stop or abandon a habit or activity", "example": "She gave up smoking last year."}]),
    w("go over", [{"definition": "Review or examine something carefully", "example": "Let's go over the notes together."}, {"definition": "Be received favorably", "example": "The speech went over well."}]),
    w("hand in", [{"definition": "Give something to a person in authority, especially an assignment", "example": "Please hand in your homework."}]),
    w("hang out", [{"definition": "Spend time relaxing or socializing", "example": "We hung out at the park."}]),
    w("hold on", [{"definition": "Wait for a short time", "example": "Hold on a second."}, {"definition": "Remain attached or continue to withstand something", "example": "The rope held on despite the weight."}]),

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}
function sample(arr,n){ return shuffle(arr).slice(0, Math.min(n, arr.length)); }
function pickOne(arr){ return arr[Math.floor(Math.random()*arr.length)]; }

// Rated 3s show up most often, then 2s, then unrated (so new/unreviewed
// items still surface); rated 1s ("already know this") are excluded from
// drawn activities but still count for Warmup Review and Manage Lists.
function weightForRating(rating){
  if(rating === 3) return 6;
  if(rating === 2) return 3;
  if(rating === 1) return 0;
  return 2; // unrated
}
function weightedSample(items, n){
  const pool = [];
  items.forEach(it=>{
    const wt = weightForRating(it.rating);
    for(let i=0;i<wt;i++) pool.push(it);
  });
  const chosen = [];
  const used = new Set();
  shuffle(pool).forEach(it=>{
    if(chosen.length < n && !used.has(it.text)){
      chosen.push(it);
      used.add(it.text);
    }
  });
  // If weighting excluded too many items to fill the draw (e.g. everything
  // rated 1), top up from the rest so a draw is never emptier than it needs to be.
  if(chosen.length < n){
    shuffle(items.filter(it=>!used.has(it.text))).forEach(it=>{
      if(chosen.length < n){ chosen.push(it); used.add(it.text); }
    });
  }
  return chosen;
}

// ---------- default-list version tracking ----------
// Each profile remembers which DEFAULT_LISTS_VERSION it was last seeded/synced from.
// A profile created before this system existed has no stored version, which is
// treated as version 0 — i.e. "out of date" — so the banner offers a one-time review.
function defaultVersionKey(name){ return "esl-toolkit-default-version-v1::" + name; }
function getStoredDefaultVersion(name){
  try{
    const v = localStorage.getItem(defaultVersionKey(name));
    return v === null ? 0 : (parseInt(v,10) || 0);
  }catch(e){ return DEFAULT_LISTS_VERSION; } // storage broken: don't nag, just assume current
}
function setStoredDefaultVersion(name, version){
  try{ localStorage.setItem(defaultVersionKey(name), String(version)); }catch(e){}
}

async function loadLists(){
  let idx = getProfileIndex();
  if(idx.length === 0){
    idx = ["Default"];
    setProfileIndex(idx);
    try{ localStorage.setItem(dataKey("Default"), JSON.stringify(DEFAULT_LISTS)); }catch(e){ storageOK = false; }
    setStoredDefaultVersion("Default", DEFAULT_LISTS_VERSION);
  }
  let last = null;
  try{ last = localStorage.getItem(LAST_PROFILE_KEY); }catch(e){}
  currentProfile = (last && idx.includes(last)) ? last : idx[0];
  loadCurrentProfileLists();
}

function loadCurrentProfileLists(){
  try{
    const raw = localStorage.getItem(dataKey(currentProfile));
    LISTS = raw ? JSON.parse(raw) : JSON.parse(JSON.stringify(DEFAULT_LISTS));
  }catch(e){
    LISTS = JSON.parse(JSON.stringify(DEFAULT_LISTS));
    storageOK = false;
  }
  setStatus(storageOK ? `"${currentProfile}" — saved on this computer/browser` : "storage unavailable — changes won't be saved, export a file to keep your work");
  checkDefaultVersion();
}

function checkDefaultVersion(){
  defaultsOutdated = storageOK && getStoredDefaultVersion(currentProfile) < DEFAULT_LISTS_VERSION;
  renderDefaultsBanner();
}

function renderDefaultsBanner(){
  const el = document.getElementById("defaultsBanner");
  if(!el) return;
  if(!defaultsOutdated){
    el.classList.add("hidden");

    return;
  }
  el.classList.remove("hidden");
  el.innerHTML = `
    <span>The shipped default lists have changed since "${escAttr(currentProfile)}" was created.</span>
    <button id="reviewDefaultsBtn" class="btn-primary">Review new items</button>
    <button id="dismissDefaultsBtn" class="btn-ghost">Dismiss</button>
  `;
  document.getElementById("reviewDefaultsBtn").addEventListener("click", openDefaultsReviewModal);
  document.getElementById("dismissDefaultsBtn").addEventListener("click", ()=>{
    setStoredDefaultVersion(currentProfile, DEFAULT_LISTS_VERSION);
    defaultsOutdated = false;
    renderDefaultsBanner();
  });
}

// Items present in the current DEFAULT_LISTS but not (by text/target match) in this
// profile's LISTS — i.e. candidates to offer in the review modal. Matching is by
// name only, so an item the student has since edited or re-rated still counts as
// "already have it" and won't be re-offered or touched.
function defaultsDiff(){
  const diff = {};
  WORD_LISTS.forEach(sec=>{
    const existing = new Set(LISTS[sec.key].map(it=>it.text));
    diff[sec.key] = DEFAULT_LISTS[sec.key].filter(it=>!existing.has(it.text));
  });
  SIMPLE_LISTS.forEach(sec=>{
    const existing = new Set(LISTS[sec.key]);
    diff[sec.key] = DEFAULT_LISTS[sec.key].filter(t=>!existing.has(t));
  });
  const existingTaboo = new Set(LISTS.taboo.map(t=>t.target));
  diff.taboo = DEFAULT_LISTS.taboo.filter(t=>!existingTaboo.has(t.target));
  return diff;
}

function openDefaultsReviewModal(){
  const diff = defaultsDiff();
  const allSections = [...WORD_LISTS, ...SIMPLE_LISTS, {key:"taboo", label:"Taboo+ words"}];
  const sectionsWithNew = allSections.filter(sec => diff[sec.key] && diff[sec.key].length);
  const overlay = document.getElementById("modalOverlay");
  const card = document.getElementById("modalCard");

  if(!sectionsWithNew.length){
    card.innerHTML = `
      <button class="modal-close" id="modalCloseBtn">&times;</button>
      <div class="eyebrow">Shipped defaults</div>
      <h2>Nothing new to add</h2>
      <p class="hint">Every item currently in the shipped default lists is already in "${escAttr(currentProfile)}". Marking this profile as up to date.</p>
      <div class="modal-actions">
        <button class="btn-primary" id="closeReviewBtn">Done</button>
      </div>
    `;
    overlay.classList.remove("hidden");
    document.getElementById("modalCloseBtn").addEventListener("click", closeModal);
    document.getElementById("closeReviewBtn").addEventListener("click", ()=>{
      setStoredDefaultVersion(currentProfile, DEFAULT_LISTS_VERSION);
      defaultsOutdated = false;
      renderDefaultsBanner();
      closeModal();
    });
    return;
  }

  card.innerHTML = `
    <button class="modal-close" id="modalCloseBtn">&times;</button>
    <div class="eyebrow">Shipped defaults updated</div>
    <h2>New items available</h2>
    <p class="hint">These are in the current shipped default lists but not yet in "${escAttr(currentProfile)}". Check the ones you want to add — nothing is changed until you click "Add checked items". Anything you don't add stays untouched, and you can review again later.</p>
    ${sectionsWithNew.map(sec=>`
      <div class="manage-section">
        <h3>${sec.label} <span class="count">(${diff[sec.key].length} new)</span></h3>
        <div class="chip-list">
          ${diff[sec.key].map((it,i)=>{
            const label = sec.key==="taboo" ? it.target : (typeof it==="string" ? it : it.text);
            return `<label class="chip"><input type="checkbox" data-diffkey="${sec.key}" data-diffidx="${i}" checked style="margin:0 2px 0 0;">${escAttr(label)}</label>`;
          }).join("")}
        </div>
      </div>
    `).join("")}
    <div class="modal-actions">
      <button class="btn-primary" id="addCheckedBtn">Add checked items</button>
      <button class="btn-ghost" id="skipDefaultsBtn">Skip — mark reviewed</button>
      <button class="btn-ghost" id="modalCancelBtn">Cancel</button>
    </div>
  `;
  overlay.classList.remove("hidden");
  document.getElementById("modalCloseBtn").addEventListener("click", closeModal);
  document.getElementById("modalCancelBtn").addEventListener("click", closeModal);
  document.getElementById("skipDefaultsBtn").addEventListener("click", ()=>{
    setStoredDefaultVersion(currentProfile, DEFAULT_LISTS_VERSION);
    defaultsOutdated = false;
    renderDefaultsBanner();
    closeModal();
  });
  document.getElementById("addCheckedBtn").addEventListener("click", async ()=>{
    const checked = Array.from(document.querySelectorAll("[data-diffkey]:checked"));
    checked.forEach(cb=>{
      const key = cb.dataset.diffkey;
      const idx = parseInt(cb.dataset.diffidx, 10);
      const item = JSON.parse(JSON.stringify(diff[key][idx])); // clone — never share references with DEFAULT_LISTS
      LISTS[key].push(item);
    });
    await saveLists();
    setStoredDefaultVersion(currentProfile, DEFAULT_LISTS_VERSION);
    defaultsOutdated = false;
    renderDefaultsBanner();
    closeModal();
    if(currentTab === "manage") renderPanel();
  });
}

async function renameProfile(){
  const name = prompt("New name for this profile:", currentProfile);
  if(!name) return;
  const clean = name.trim();
  if(!clean || clean === currentProfile) return;
  const idx = getProfileIndex();
  if(idx.includes(clean)){
    alert("A profile with that name already exists.");
    return;
  }
  const data = localStorage.getItem(dataKey(currentProfile));
  const version = getStoredDefaultVersion(currentProfile);
  try{
    localStorage.setItem(dataKey(clean), data);
    localStorage.removeItem(dataKey(currentProfile));
  }catch(e){}
  setStoredDefaultVersion(clean, version);
  try{ localStorage.removeItem(defaultVersionKey(currentProfile)); }catch(e){}
  const newIdx = idx.map(n => n===currentProfile ? clean : n);
  setProfileIndex(newIdx);
  await switchProfile(clean);
}

async function deleteProfile(){
  const idx = getProfileIndex();
  if(idx.length <= 1){
    alert("You need at least one profile — create another before deleting this one.");
    return;
  }
  if(!confirm(`Delete the profile "${currentProfile}" and its lists? This can't be undone.`)) return;
  try{ localStorage.removeItem(dataKey(currentProfile)); }catch(e){}
  try{ localStorage.removeItem(defaultVersionKey(currentProfile)); }catch(e){}
  const newIdx = idx.filter(n => n !== currentProfile);
  setProfileIndex(newIdx);
  await switchProfile(newIdx[0]);
}

async function saveBlobToFile(blob, suggestedName){
  if(window.showSaveFilePicker){
    try{
      const handle = await window.showSaveFilePicker({
        suggestedName,
        types:[{
          description: blob.type === "application/json" ? "JSON file" : "HTML file",
          accept:{[blob.type || "application/octet-stream"]:[blob.type === "application/json" ? ".json" : ".html"]}
        }]
      });
      const writable = await handle.createWritable();
      await writable.write(blob);
      await writable.close();
      return true;
    }catch(err){
      if(err && err.name === "AbortError") return false;
      // Fall through to the normal browser download if the picker is unavailable
      // or cannot be used in this browser.
    }
  }
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = suggestedName;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url), 1000);
  return true;
}

async function exportProfile(){
  const payload = {profileName: currentProfile, lists: LISTS};
  const blob = new Blob([JSON.stringify(payload, null, 2)], {type:"application/json"});
  await saveBlobToFile(
    blob,
    `${currentProfile.replace(/[^a-z0-9\-_]+/gi,"_")}-speaking-toolkit.json`
  );
}

function importProfileFile(file){
  const reader = new FileReader();
  reader.onload = async (e)=>{
    let payload;
    try{
      payload = JSON.parse(e.target.result);
    }catch(err){
      alert("That doesn't look like a valid exported file.");
      return;
    }
    const suggested = payload.profileName || file.name.replace(/\.json$/i,"");
    const name = prompt("Save this as which profile name?", suggested);
    if(!name) return;
    const clean = name.trim();
    if(!clean) return;
    const idx = getProfileIndex();
    if(idx.includes(clean) && !confirm(`"${clean}" already exists — overwrite it?`)) return;
    if(!idx.includes(clean)){ idx.push(clean); setProfileIndex(idx); }
    try{ localStorage.setItem(dataKey(clean), JSON.stringify(payload.lists || payload)); }catch(e){}
    await switchProfile(clean);
  };
  reader.readAsText(file);
}

const RATING_LABELS = {

function buildWarmupQueue(listKey, batchSize, includeAll){
  const all = LISTS[listKey];
  let pool = includeAll ? all.slice() : all.filter(it=>!it.rating);
  pool.sort((a,b)=>{
    const ar = (typeof a.freqRank==="number") ? a.freqRank : Infinity;
    const br = (typeof b.freqRank==="number") ? b.freqRank : Infinity;
    return ar - br;
  });
  return pool.slice(0, batchSize);
}

function warmupHTML(){
  const label = warmupState && warmupState.listKey === "idioms" ? "idioms" : "phrasal verbs";
  if(!warmupState){
    const pvUnrated = LISTS.phrasalVerbs.filter(it=>!it.rating).length;
    const idUnrated = LISTS.idioms.filter(it=>!it.rating).length;
    return `
      <div class="card-index fresh">
        <div class="eyebrow">Warmup Review</div>
        <h2>Rate a batch before you start</h2>
        <p class="hint" style="margin-top:0;">Step through a batch and rate each one. 1 = already fluent with it, no need to review. 3 = genuinely useful to get practice on. Ratings feed back into which words get drawn in Story Cubes, Debate Cards, and Laddering — 3s show up most, 1s get skipped.</p>
        <div class="group-label">List</div>
        <select id="warmupList">
          <option value="phrasalVerbs">Phrasal verbs (${pvUnrated} unrated of ${LISTS.phrasalVerbs.length})</option>
          <option value="idioms">Idioms (${idUnrated} unrated of ${LISTS.idioms.length})</option>
        </select>
        <div class="group-label">Batch size</div>
        <input type="number" id="warmupBatchSize" value="15" min="1" max="100" style="width:80px;font-family:'Inter',sans-serif;font-size:0.92rem;padding:7px 9px;border:1.3px solid var(--card-line);border-radius:5px;">
        <div style="margin-top:10px;">
          <label style="font-size:0.85rem;color:var(--ink-light);"><input type="checkbox" id="warmupIncludeAll"> include already-rated items too (re-review)</label>
        </div>
      </div>
      <button class="draw-btn" id="startWarmup">Start review</button>
    `;
  }

  if(warmupState.pos >= warmupState.queue.length){
    return `
      <div class="card-index fresh">
        <div class="eyebrow">Warmup Review — done</div>
        <h2>Rated ${warmupState.pos} ${label} this round.</h2>
        <p class="hint">Nice work. Run another batch now, or come back to it next session — another 10 or 20 at a time keeps this from feeling like a chore.</p>
      </div>
      <button class="draw-btn" id="warmupAnother">Review another batch</button>
      <button class="draw-btn" id="warmupDone" style="background:none;color:var(--navy);border:1.5px solid var(--navy);">Done for now</button>
    `;
  }

  const item = warmupState.queue[warmupState.pos];
  return `
    <div class="card-index fresh">
      <div class="eyebrow">Warmup Review — ${warmupState.pos+1} of ${warmupState.queue.length}</div>
      <h2>${item.text}</h2>
      ${item.meanings.map((m,i)=>`
        <div class="meaning-block">
          ${item.meanings.length>1 ? `<div class="meaning-num">Meaning ${i+1}</div>` : ``}
          <div class="meaning-def">${m.definition}</div>
          <div class="meaning-ex">"${m.example}"</div>
        </div>
      `).join("") || `<p class="empty-hint">No definition on file yet — add one in Manage Lists.</p>`}
    </div>
    <div class="modal-actions" style="margin-top:16px;">
      <button class="btn-danger" data-rate="1">1 — ${RATING_LABELS[1]}</button>
      <button class="btn-ghost" data-rate="2">2 — ${RATING_LABELS[2]}</button>
      <button class="btn-primary" data-rate="3">3 — ${RATING_LABELS[3]}</button>
    </div>
    <button class="draw-btn" id="warmupSkip" style="background:none;color:var(--ink-light);border:1.5px solid var(--card-line);margin-top:10px;">Skip, leave unrated</button>
  `;
}

function tagGroup(label, items, cls, listKey){
  if(!items || !items.length){
    return `<div class="group-label">${label}</div><p class="empty-hint">not enough items in this list yet</p>`;
  }
  return `<div class="group-label">${label}</div><div class="tagrow">${items.map(it=>`<button type="button" class="tag ${cls}" data-list="${listKey}" data-text="${escAttr(it.text)}">${it.text}</button>`).join("")}</div>`;
}

const SIMPLE_LISTS = [
  {key:"themes", label:"Story themes"},
  {key:"debateTopics", label:"Debate topics"},
  {key:"ladderStarters", label:"Laddering starter sentences"}
];
const WORD_LISTS = [
  {key:"phrasalVerbs", label:"Phrasal verbs", ratable:true},
  {key:"idioms", label:"Idioms", ratable:true},
  {key:"vocabulary", label:"Vocabulary", ratable:true}
];

function ratingBadge(rating){
  if(!rating) return "";
  const colorVar = rating===3 ? "var(--teal)" : rating===2 ? "var(--gold)" : "var(--card-margin)";
  return ` <span style="color:${colorVar};font-family:'IBM Plex Mono',monospace;font-size:0.72rem;">★${rating}</span>`;
}

function manageHTML(){
  let html = `<div class="manage-grid">`;

  WORD_LISTS.forEach(sec=>{
    const items = LISTS[sec.key];
    html += `
      <div class="manage-section">
        <h3>${sec.label} <span class="count">(${items.length})</span></h3>
        <p class="hint" style="margin-top:0;">Tap a word to view or edit its definitions and examples.${sec.ratable ? " ★ shows this student's warmup rating." : ""}</p>
        <div class="chip-list">
          ${items.map((it,i)=>`<span class="chip" data-editlist="${sec.key}" data-editidx="${i}">${it.text}${sec.ratable ? ratingBadge(it.rating) : ""}<button data-list="${sec.key}" data-idx="${i}" class="del-word">×</button></span>`).join("") || `<span class="empty-hint">none yet</span>`}
        </div>
        <div style="display:flex;gap:8px;flex-wrap:wrap;">
          <button class="add-word-btn" data-newword="${sec.key}">+ Add a new ${sec.label.toLowerCase().replace(/s$/,'')}</button>
          ${sec.ratable ? `<button class="add-word-btn" data-bulktoggle="${sec.key}">+ Bulk import list</button>` : ``}
        </div>
        ${sec.ratable ? `
        <div class="bulk-box hidden" id="bulkbox-${sec.key}" style="margin-top:10px;">
          <p class="hint" style="margin-top:0;">Paste one item per line, most frequent first. Either just the phrase, or <code>phrase | definition | example</code>. Rank is set by line order; existing entries with the same text are skipped.</p>
          <textarea id="bulktext-${sec.key}" rows="6" style="width:100%;font-family:'IBM Plex Mono',monospace;font-size:0.82rem;padding:8px;border:1.3px solid var(--card-line);border-radius:5px;background:var(--paper);"></textarea>
          <button class="draw-btn" data-bulksubmit="${sec.key}" style="margin-top:8px;">Import lines</button>
        </div>` : ``}
      </div>
    `;
  });

  SIMPLE_LISTS.forEach(sec=>{
    const items = LISTS[sec.key];
    html += `
      <div class="manage-section">
        <h3>${sec.label} <span class="count">(${items.length})</span></h3>
        <div class="chip-list">
          ${items.map((it,i)=>`<span class="chip">${it}<button data-list="${sec.key}" data-idx="${i}" class="del-simple">×</button></span>`).join("") || `<span class="empty-hint">none yet</span>`}
        </div>
        <div class="add-row">
          <input type="text" data-add="${sec.key}" placeholder="Add to ${sec.label.toLowerCase()}…">
          <button data-addbtn="${sec.key}">Add</button>
        </div>
      </div>
    `;
  });

  html += `
    <div class="manage-section">
      <h3>Taboo+ words <span class="count">(${LISTS.taboo.length})</span></h3>
      ${LISTS.taboo.map((t,i)=>`
        <div class="taboo-manage-item">
          <div><strong>${t.target}</strong> — <span class="fb">${t.forbidden.join(", ")}</span></div>
          <button data-del-taboo="${i}">×</button>
        </div>
      `).join("") || `<p class="empty-hint">none yet</p>`}
      <div class="add-row" style="margin-top:8px;">
        <input type="text" id="tabooTarget" placeholder="Target word (e.g. optimistic)">
      </div>
      <div class="add-row" style="margin-top:8px;">
        <input type="text" id="tabooForbidden" placeholder="Forbidden words, comma-separated">
        <button id="addTabooBtn">Add</button>
      </div>
    </div>
  `;
  html += `</div>`;
  return html;
}

// ---------- MODAL: view mode ----------
function openViewModal(listKey, text){
  const item = LISTS[listKey].find(it=>it.text===text);
  if(!item) return;
  const overlay = document.getElementById("modalOverlay");
  const card = document.getElementById("modalCard");
  card.innerHTML = `
    <button class="modal-close" id="modalCloseBtn">&times;</button>
    <div class="eyebrow">${listKey === "phrasalVerbs" ? "Phrasal verb" : listKey === "idioms" ? "Idiom" : "Vocabulary"}</div>
    <h2>${item.text}</h2>
    ${item.meanings.map((m,i)=>`
      <div class="meaning-block">
        ${item.meanings.length>1 ? `<div class="meaning-num">Meaning ${i+1}</div>` : ``}
        <div class="meaning-def">${m.definition}</div>
        <div class="meaning-ex">"${m.example}"</div>
      </div>
    `).join("")}
    <div class="group-label" style="margin-top:18px;">Student rating</div>
    <div class="modal-actions">
      <button class="${item.rating===1 ? "btn-danger" : "btn-ghost"}" data-view-rate="1">1 — ${RATING_LABELS[1]}</button>
      <button class="${item.rating===2 ? "btn-primary" : "btn-ghost"}" data-view-rate="2">2 — ${RATING_LABELS[2]}</button>
      <button class="${item.rating===3 ? "btn-primary" : "btn-ghost"}" data-view-rate="3">3 — ${RATING_LABELS[3]}</button>
    </div>
  `;
  overlay.classList.remove("hidden");
  document.getElementById("modalCloseBtn").addEventListener("click", closeModal);
  document.querySelectorAll("[data-view-rate]").forEach(btn=>{
    btn.addEventListener("click", async ()=>{
      item.rating = parseInt(btn.dataset.viewRate,10);
      await saveLists();
      closeModal();
      renderPanel();
    });
  });
}

// ---------- MODAL: edit mode ----------
function openEditModal(listKey, index){
  const isNew = index === null;
  const source = isNew ? {text:"", meanings:[{definition:"",example:""}]} : LISTS[listKey][index];
  editState = {listKey, index, text: source.text, meanings: source.meanings.map(m=>({...m}))};
  renderEditModal();
  document.getElementById("modalOverlay").classList.remove("hidden");
}

function renderEditModal(){
  const card = document.getElementById("modalCard");
  const label = editState.listKey === "phrasalVerbs" ? "phrasal verb" : editState.listKey === "idioms" ? "idiom" : "vocabulary word";
  card.innerHTML = `
    <button class="modal-close" id="modalCloseBtn">&times;</button>
    <div class="eyebrow">${editState.index===null ? "Add" : "Edit"} ${label}</div>
    <div class="edit-field">
      <label>Word or phrase</label>
      <input type="text" id="editWordText" value="${escAttr(editState.text)}">
    </div>
    <div id="meaningsContainer">
      ${editState.meanings.map((m,i)=>`
        <div class="meaning-block">
          <div class="meaning-num">Meaning ${i+1} ${editState.meanings.length>1 ? `<button class="remove-meaning-btn" data-removemeaning="${i}">remove</button>` : ``}</div>
          <div class="edit-field">
            <label>Definition</label>
            <textarea rows="2" data-meaningfield="definition" data-meaningidx="${i}">${m.definition}</textarea>
            <label>Example sentence</label>
            <input type="text" data-meaningfield="example" data-meaningidx="${i}" value="${escAttr(m.example)}">
          </div>
        </div>
      `).join("")}
    </div>
    <button class="add-word-btn" id="addMeaningBtn">+ Add another meaning</button>
    <div class="modal-actions">
      <button class="btn-primary" id="saveEditBtn">Save</button>
      <button class="btn-ghost" id="cancelEditBtn">Cancel</button>
      ${editState.index!==null ? `<button class="btn-danger" id="deleteEditBtn">Delete word</button>` : ``}
    </div>
  `;
  document.getElementById("modalCloseBtn").addEventListener("click", closeModal);
  document.getElementById("cancelEditBtn").addEventListener("click", closeModal);
  document.getElementById("editWordText").addEventListener("input", e=>{ editState.text = e.target.value; });
  document.querySelectorAll("[data-meaningfield]").forEach(el=>{
    el.addEventListener("input", e=>{
      const idx = parseInt(e.target.dataset.meaningidx,10);
      const field = e.target.dataset.meaningfield;
      editState.meanings[idx][field] = e.target.value;
    });
  });
  document.querySelectorAll("[data-removemeaning]").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      const idx = parseInt(btn.dataset.removemeaning,10);
      editState.meanings.splice(idx,1);
      renderEditModal();
    });
  });
  document.getElementById("addMeaningBtn").addEventListener("click", ()=>{
    editState.meanings.push({definition:"",example:""});
    renderEditModal();
  });
  document.getElementById("saveEditBtn").addEventListener("click", async ()=>{
    const cleanText = editState.text.trim();
    const cleanMeanings = editState.meanings
      .map(m=>({definition:m.definition.trim(), example:m.example.trim()}))
      .filter(m=>m.definition || m.example);
    if(!cleanText || !cleanMeanings.length){
      setStatus("word and at least one definition are required");
      return;
    }
    const existing = editState.index!==null ? LISTS[editState.listKey][editState.index] : null;
    const newItem = {
      text:cleanText,
      meanings:cleanMeanings,
      rating: existing ? (existing.rating || null) : null,
      freqRank: existing ? (typeof existing.freqRank==="number" ? existing.freqRank : null) : null
    };
    if(editState.index===null){
      LISTS[editState.listKey].push(newItem);
    }else{
      LISTS[editState.listKey][editState.index] = newItem;
    }
    await saveLists();
    closeModal();
    renderPanel();
  });
  const delBtn = document.getElementById("deleteEditBtn");
  if(delBtn){
    delBtn.addEventListener("click", async ()=>{
      LISTS[editState.listKey].splice(editState.index,1);
      await saveLists();
      closeModal();
      renderPanel();
    });
  }
}

function closeModal(){
  document.getElementById("modalOverlay").classList.add("hidden");
  editState = null;
}

document.getElementById("modalOverlay").addEventListener("click", e=>{
  if(e.target.id === "modalOverlay") closeModal();
});

// ---------- PRINT SET ----------
function updatePrintSetButton(){
  const btn = document.getElementById("printSetBtn");
  if(btn) btn.textContent = `Print set (${printSet.length})`;
}

function snapshotCurrentExercise(){
  const d = currentDraw[currentTab];
  if(!d || !["story","debate","taboo","ladder"].includes(currentTab)) return null;
  return JSON.parse(JSON.stringify({type:currentTab, data:d}));
}

function exerciseTitle(ex){
  if(ex.type==="story") return ex.data.theme || "Story Cube";
  if(ex.type==="debate") return ex.data.topic || "Debate Card";
  if(ex.type==="taboo") return ex.data.target || "Taboo+";
  if(ex.type==="ladder") return ex.data.starter || "Laddering";
  return "Exercise";
}

function exerciseTypeLabel(type){
  return ({story:"Story Cubes", debate:"Debate Card", taboo:"Taboo+", ladder:"Laddering"})[type] || "Exercise";
}

function addCurrentExerciseToPrintSet(){
  const ex = snapshotCurrentExercise();
  if(!ex) return;
  printSet.push(ex);
  updatePrintSetButton();
  setStatus(`${exerciseTypeLabel(ex.type)} added to print set — ${printSet.length} exercise${printSet.length===1?"":"s"}.`);
}

function printableDefinitionHTML(item){
  if(!item || !Array.isArray(item.meanings) || !item.meanings.length) return "";
  return `<div class="print-definition">
    ${item.meanings.map((m,i)=>`<div class="print-meaning">
      ${item.meanings.length>1 ? `<div class="print-meaning-num">Meaning ${i+1}</div>` : ""}
      <div class="print-def">${escHTML(m.definition || "")}</div>
      ${m.example ? `<div class="print-example">“${escHTML(m.example)}”</div>` : ""}
    </div>`).join("")}
  </div>`;
}

function printableItemHTML(item){
  if(!item) return "";
  return `<div class="print-item">
    <div class="print-tag">${escHTML(item.text || "")}</div>
    ${printableDefinitionHTML(item)}
  </div>`;
}

function printableItemsHTML(label, items){
  return `<div class="print-group"><div class="print-label">${label}</div>
    <div class="print-items">${(items||[]).map(printableItemHTML).join("")}</div>
  </div>`;
}

function findListItemByText(text){
  if(!text) return null;
  for(const key of ["phrasalVerbs","idioms","vocabulary"]){
    const found = LISTS[key]?.find(it=>it.text===text);
    if(found) return found;
  }
  return null;
}

function printableExerciseHTML(ex,typeChange){
  const d = ex.data;
  if(ex.type==="story"){
    return `<article class="print-card${typeChange ? " type-change" : ""}">
      <div class="print-eyebrow">Story Cubes — tell it, then tell it again</div>
      <h1>${escHTML(d.theme || "")}</h1>
      ${printableItemsHTML("Phrasal verbs",d.pv)}
      ${printableItemsHTML("Idioms",d.idioms)}
      ${printableItemsHTML("Vocabulary",d.vocab)}
      <p class="print-hint">Improvise a story on the theme, working in every expression.</p>
    </article>`;
  }
  if(ex.type==="debate"){
    return `<article class="print-card${typeChange ? " type-change" : ""}">
      <div class="print-eyebrow">Debate Cards</div>
      <h1>${escHTML(d.topic || "")}</h1>
      ${printableItemsHTML("Must use — phrasal verbs",d.pv)}
      ${printableItemsHTML("Must use — idioms",d.idioms)}
      ${printableItemsHTML("Must use — vocabulary",d.vocab)}
      <p class="print-hint">Argue one side (or play devil's advocate) and work every required expression in naturally.</p>
    </article>`;
  }
  if(ex.type==="taboo"){
    const targetItem = findListItemByText(d.target);
    return `<article class="print-card${typeChange ? " type-change" : ""}">
      <div class="print-eyebrow">Taboo+ — explain it without these</div>
      <h1>${escHTML(d.target || "")}</h1>
      ${targetItem ? printableDefinitionHTML(targetItem) : ""}
      <div class="print-label">Forbidden words</div>
      <ul class="print-forbidden">${(d.forbidden||[]).map(x=>`<li>${escHTML(x)}</li>`).join("")}</ul>
      <p class="print-hint">Define or explain the target word out loud without using any of the forbidden words.</p>
    </article>`;
  }
  return `<article class="print-card${typeChange ? " type-change" : ""}">
    <div class="print-eyebrow">Laddering — build the sentence up</div>
    <h1>“${escHTML(d.starter || "")}"</h1>
    <div class="print-label">Work these in, one rung at a time</div>
    <ol class="print-ladder">
      <li>Add a detail (where, when, who).</li>
      <li>Add a reaction or feeling.</li>
      <li>Insert the phrasal verb: <strong>${escHTML(d.pv?.text || "—")}</strong>${printableDefinitionHTML(d.pv)}</li>
      <li>Insert the idiom: <strong>${escHTML(d.idiom?.text || "—")}</strong>${printableDefinitionHTML(d.idiom)}</li>
      <li>Insert the vocabulary word: <strong>${escHTML(d.vocab?.text || "—")}</strong>${printableDefinitionHTML(d.vocab)}</li>
    </ol>
  </article>`;
}

    <title>${escHTML(currentProfile)} — speaking exercises</title>
    <style>
      @page{size:auto;margin:0.45in;}
      *{box-sizing:border-box}

      .print-group{margin:7px 0}.print-label{font:700 12px/1.25 monospace;text-transform:uppercase;letter-spacing:.06em;color:#168C8C;margin-bottom:4px}
      .print-tags{display:flex;flex-wrap:wrap;gap:5px}.print-tag{display:inline-block;font-size:12px;font-weight:700;border:1px solid #000;border-radius:10px;padding:3px 6px;color:#000}
      .print-hint{font-size:11px;line-height:1.35;color:#000;margin-top:8px}
      .print-forbidden{margin:5px 0 9px;padding-left:18px}.print-forbidden li{font:12.5px monospace;text-decoration:line-through;margin:3px 0;color:#000}

      ${printSet.map((ex,i)=>`
        <div class="print-set-item">
          <span class="set-num">${i+1}</span>
          <span class="set-title">${escHTML(exerciseTitle(ex))}</span>
          <span class="set-type">${exerciseTypeLabel(ex.type)}</span>
          <button type="button" data-remove-print="${i}" title="Remove">×</button>
        </div>`).join("") || `<p class="empty-hint">No exercises added yet.</p>`}

      <button class="btn-primary" id="printSetNow" ${printSet.length?"":"disabled"}>Print set</button>

      <button class="btn-danger" id="clearPrintSet" ${printSet.length?"":"disabled"}>Clear set</button>
    </div>`;
  overlay.classList.remove("hidden");
  document.getElementById("modalCloseBtn").addEventListener("click", closeModal);

  });
  document.getElementById("savePrintSet").addEventListener("click", async ()=>{
    const blob = new Blob([JSON.stringify({profileName:currentProfile, exercises:printSet},null,2)], {type:"application/json"});
    await saveBlobToFile(blob, `${currentProfile.replace(/[^a-z0-9\\-_]+/gi,"_")}-exercise-set.json`);
    setStatus("exercise set saved");
  });
  document.getElementById("printSetNow").addEventListener("click", ()=>{
    const win = window.open("", "_blank");
    if(!win){ alert("Please allow pop-ups for this file so the print window can open."); return; }
    win.document.open();
    win.document.write(printSetHTML());
    win.document.close();
    win.focus();
    setTimeout(()=>win.print(), 350);
  });
}

function escHTML(s){
  return String(s ?? "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;");
}

function attachPanelHandlers(){
  const reroll = document.getElementById("reroll");
  if(reroll){
    reroll.addEventListener("click", ()=>{
      if(currentTab==="story") drawStory();
      if(currentTab==="debate") drawDebate();
      if(currentTab==="taboo") drawTaboo();
      if(currentTab==="ladder") drawLadder();
      renderPanel();
    });
  }

  document.querySelectorAll(".tag[data-list], strong[data-list]").forEach(el=>{
    el.addEventListener("click", ()=>{
      openViewModal(el.dataset.list, el.dataset.text);
    });
  });

  const addToPrint = document.getElementById("addToPrintSet");
  if(addToPrint){
    addToPrint.addEventListener("click", addCurrentExerciseToPrintSet);
  }

  if(currentTab === "manage"){
    document.querySelectorAll(".del-simple").forEach(btn=>{
      btn.addEventListener("click", async (e)=>{
        e.stopPropagation();
        const key = btn.dataset.list, idx = parseInt(btn.dataset.idx,10);
        LISTS[key].splice(idx,1);
        await saveLists();
        renderPanel();
      });
    });
    document.querySelectorAll(".del-word").forEach(btn=>{
      btn.addEventListener("click", async (e)=>{
        e.stopPropagation();
        const key = btn.dataset.list, idx = parseInt(btn.dataset.idx,10);
        LISTS[key].splice(idx,1);
        await saveLists();
        renderPanel();
      });
    });
    document.querySelectorAll(".chip[data-editlist]").forEach(chip=>{
      chip.addEventListener("click", ()=>{
        openEditModal(chip.dataset.editlist, parseInt(chip.dataset.editidx,10));
      });
    });
    document.querySelectorAll("[data-newword]").forEach(btn=>{
      btn.addEventListener("click", ()=>{
        openEditModal(btn.dataset.newword, null);
      });
    });
    SIMPLE_LISTS.forEach(sec=>{
      const btn = document.querySelector(`[data-addbtn="${sec.key}"]`);
      const input = document.querySelector(`[data-add="${sec.key}"]`);
      const submit = async ()=>{
        const val = input.value.trim();
        if(!val) return;
        LISTS[sec.key].push(val);
        input.value = "";
        await saveLists();
        renderPanel();
      };
      if(btn) btn.addEventListener("click", submit);
      if(input) input.addEventListener("keydown", e=>{ if(e.key==="Enter") submit(); });
    });
    document.querySelectorAll("[data-del-taboo]").forEach(btn=>{
      btn.addEventListener("click", async ()=>{
        const idx = parseInt(btn.dataset.delTaboo,10);
        LISTS.taboo.splice(idx,1);
        await saveLists();
        renderPanel();
      });
    });
    const addTabooBtn = document.getElementById("addTabooBtn");
    if(addTabooBtn){
      addTabooBtn.addEventListener("click", async ()=>{
        const target = document.getElementById("tabooTarget").value.trim();
        const forbiddenRaw = document.getElementById("tabooForbidden").value.trim();
        if(!target || !forbiddenRaw) return;
        const forbidden = forbiddenRaw.split(",").map(s=>s.trim()).filter(Boolean);
        LISTS.taboo.push({target, forbidden});
        await saveLists();
        renderPanel();
      });
    }
    document.querySelectorAll("[data-bulktoggle]").forEach(btn=>{
      btn.addEventListener("click", ()=>{
        const box = document.getElementById(`bulkbox-${btn.dataset.bulktoggle}`);
        if(box) box.classList.toggle("hidden");
      });
    });
    document.querySelectorAll("[data-bulksubmit]").forEach(btn=>{
      btn.addEventListener("click", async ()=>{
        const key = btn.dataset.bulksubmit;
        const textarea = document.getElementById(`bulktext-${key}`);
        const result = bulkImportWords(key, textarea.value);
        await saveLists();
        setStatus(`added ${result.added}, skipped ${result.skipped} duplicate(s)`);
        renderPanel();
      });
    });
  }

  if(currentTab === "warmup"){
    const startBtn = document.getElementById("startWarmup");
    if(startBtn){
      startBtn.addEventListener("click", ()=>{
        const listKey = document.getElementById("warmupList").value;
        const batchSize = Math.max(1, parseInt(document.getElementById("warmupBatchSize").value,10) || 15);
        const includeAll = document.getElementById("warmupIncludeAll").checked;
        warmupState = {
          listKey, batchSize, includeAll,
          queue: buildWarmupQueue(listKey, batchSize, includeAll),
          pos: 0
        };
        renderPanel();
      });
    }
    document.querySelectorAll("[data-rate]").forEach(btn=>{
      btn.addEventListener("click", async ()=>{
        const rating = parseInt(btn.dataset.rate,10);
        const item = warmupState.queue[warmupState.pos];
        const stored = LISTS[warmupState.listKey].find(it=>it.text===item.text);
        if(stored) stored.rating = rating;
        await saveLists();
        warmupState.pos++;
        renderPanel();
      });
    });
    const skipBtn = document.getElementById("warmupSkip");
    if(skipBtn){
      skipBtn.addEventListener("click", ()=>{
        warmupState.pos++;
        renderPanel();
      });
    }
    const anotherBtn = document.getElementById("warmupAnother");
    if(anotherBtn){
      anotherBtn.addEventListener("click", ()=>{
        const {listKey, batchSize, includeAll} = warmupState;
        warmupState = {listKey, batchSize, includeAll, queue: buildWarmupQueue(listKey, batchSize, includeAll), pos:0};
        renderPanel();
      });
    }
    const doneBtn = document.getElementById("warmupDone");
    if(doneBtn){
      doneBtn.addEventListener("click", ()=>{
        warmupState = null;
        renderPanel();
      });
    }
  }
}

document.querySelectorAll("#tabs button").forEach(btn=>{
  btn.addEventListener("click", ()=>{
    currentTab = btn.dataset.tab;
    renderTabs();
    renderPanel();
  });
});

document.getElementById("profileSelect").addEventListener("change", (e)=>{
  switchProfile(e.target.value);
});

document.getElementById("renameProfileBtn").addEventListener("click", renameProfile);
document.getElementById("deleteProfileBtn").addEventListener("click", deleteProfile);
document.getElementById("exportProfileBtn").addEventListener("click", exportProfile);
document.getElementById("printSetBtn").addEventListener("click", openPrintSetModal);
document.getElementById("importProfileBtn").addEventListener("click", ()=>{
  document.getElementById("importFileInput").click();
});

  if(file) importProfileFile(file);
  e.target.value = "";
});

  await loadLists();
  renderProfileBar();
  renderTabs();
  renderPanel();
})();
</script>
